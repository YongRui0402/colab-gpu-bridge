[project]
name = "cgb"
version = "0.1.0"
description = "Colab GPU 工作階段管理與模型目錄(colab-gpu-bridge)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "sse-starlette==3.7.0",
    "google-auth-oauthlib==1.5.0",
    "google-colab-cli==0.7.5",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "playwright==1.64.1",
    "pytest-playwright==0.10.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

# src/ 版面;editable 安裝以 .pth 指到 src/,套件資料夾還沒建立時 uv sync 也能完成
[tool.hatch.build.targets.wheel]
packages = ["src/cgb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 實跑案例會打真實 Colab、花 compute units;預設排除,要跑時明確帶 -m realrun
# 接本機臨時 ollama serve 的實跑案例(005 Q30)也預設排除,要跑時帶 -m realrun_local
addopts = ["-m", "not realrun and not realrun_local"]
markers = [
    "realrun: 打真實 Colab、ollama.com、Google 或起真容器的實跑案例(預設排除,執行時帶 -m realrun)",
    "realrun_local: 接本機臨時 ollama serve 的實跑案例,不開 Colab、不花 compute units(預設排除,執行時帶 -m realrun_local)",
]
