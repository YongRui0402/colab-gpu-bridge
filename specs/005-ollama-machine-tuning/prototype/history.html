<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>紀錄|Colab GPU 橋接</title>
  <link rel="stylesheet" href="style.css">
  <script src="mock.js"></script>
</head>
<body data-requirements="FR-004 FR-005 FR-013 FR-016">
  <header class="topbar">
    <a class="brand" href="index.html">Colab GPU 橋接</a>
    <nav>
      <a href="index.html">工作階段</a>
      <a href="../../004-chat-hf-curated-queue/prototype/models.html">模型</a>
      <a href="../../004-chat-hf-curated-queue/prototype/library.html">下載模型</a>
      <a href="../../004-chat-hf-curated-queue/prototype/chat.html">對話</a>
      <a href="history.html" aria-current="page">紀錄</a>
    </nav>
    <div class="topbar-status">
      <a href="index.html"><span class="pill" id="session-pill">未開啟</span></a>
    </div>
  </header>
  <main>
    <h1>紀錄</h1>

    <!-- 最近的工作階段(SessionRecord) -->
    <section data-state="normal" class="panel">
      <div class="panel-head">
        <h2>最近的工作階段</h2>
        <span class="small muted">點一列看那個工作階段每一次的 Ollama 設定</span>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>開啟時間</th>
            <th>結束時間</th>
            <th>類型</th>
            <th>結束原因</th>
            <th class="num">運行時長</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <!-- 一個工作階段的 Ollama 設定明細(SessionRecordDetail.tunings;FR-005、FR-016,US1 情境 4、US3 情境 10) -->
    <section data-state="tuning-log" data-group="detail" class="panel">
      <div class="panel-head">
        <h2>Ollama 設定:<span class="mono" id="d-name"></span></h2>
        <button type="button" class="btn btn-small" id="d-close">收起</button>
      </div>
      <div id="d-body"></div>
    </section>

    <section data-state="empty" class="panel">
      <h2>最近的工作階段</h2>
      <div class="empty">
        <p>還沒有任何工作階段的紀錄。開啟過一次之後,這裡會列出開啟與結束時間、類型、結束原因、運行時長,以及每一次的 Ollama 設定。</p>
        <a class="btn btn-primary" href="index.html">到工作階段開啟</a>
      </div>
    </section>
  </main>
  <script>
    const ui = Proto.load("ui") ?? {};
    let openIndex = ui.open ?? null;

    const statePill = (h) => {
      if (h.endReason) {
        const reason = END_REASON[h.endReason];
        return `<span class="pill ${reason.pill}">${reason.text}</span>`;
      }
      const label = Proto.stateLabel(h.state);
      return `<span class="pill ${label.pill}">${label.text}</span>`;
    };
    const cell = (it, key) => {
      if (it.value === null) return `<span class="muted">—</span> ${Proto.sourceTag(it.source)}`;
      const v = key === "flashAttention" ? "開啟" : key === "kvCacheType" ? `<span class="mono">${it.value}</span>` : it.value.toLocaleString("zh-TW");
      return `${v} ${Proto.sourceTag(it.source)}`;
    };
    const stageText = (r) => (r.remoteStage ? REMOTE_STAGE[r.remoteStage] : "遠端腳本沒有回報是哪一段");

    // 目前的工作階段排在最上面,之後是已結束的(001 紀錄頁)
    const sessions = () => {
      const s = Proto.load("session");
      const list = Proto.load("history");
      if (["none", "ended", "lost", "open_failed"].includes(s.state)) return list;
      return [{ name: s.name, runtimeType: s.runtimeType, state: s.state, endReason: null, openedAt: s.openedAt, endedAt: null, tunings: Proto.load("tunings") }, ...list];
    };

    // 實際生效的設定;沒有生效的(失敗、中斷、套用中、讀不到)寫出原因
    const effective = (r) => {
      if (r.tuning) {
        return `<td>${cell(r.tuning.numParallel)}</td><td>${cell(r.tuning.contextLength)}</td><td>${cell(r.tuning.maxLoadedModels)}</td><td>${cell(r.tuning.flashAttention, "flashAttention")}</td><td>${cell(r.tuning.kvCacheType, "kvCacheType")}</td>`;
      }
      const why = {
        in_progress: "還在套用,重啟完才知道",
        failed: "沒有生效:改回自動值也沒能讓 Ollama 起來",
        interrupted: "沒有生效:套用到一半被結束,或後端停機後接回",
      }[r.result] ?? "讀不到這次套用的設定(Ollama 已在執行,執行環境上沒有設定檔)";
      return `<td colspan="5" class="muted">${why}</td>`;
    };

    const note = (r) => {
      const lines = [];
      if (r.message) lines.push(Proto.escape(r.message));
      if (r.result === "fell_back_to_auto" || r.result === "failed") lines.push(`失敗在「${stageText(r)}」 <span class="mono">${r.reasonCode ?? ""}</span>`);
      if (r.trigger === "apply" && r.reloaded?.length) lines.push(`重新載入 ${r.reloaded.map((n) => `<span class="mono">${Proto.escape(n)}</span>`).join("、")}`);
      r.notReloaded?.forEach((n) => lines.push(`<span class="mono">${Proto.escape(n.model)}</span> ${n.reason === "OVER_LIMIT" ? "超過同時載入模型數,沒有重新載入" : `重新載入失敗(<span class="mono">${n.reasonCode}</span>)`}`));
      return lines.length ? `<div class="small muted">${lines.join("<br>")}</div>` : "";
    };

    const renderDetail = (h) => {
      document.getElementById("d-name").textContent = h.name;
      document.getElementById("d-body").innerHTML = h.tunings.length
        ? `<table class="table tuning-table">
            <thead><tr><th>時間</th><th>觸發</th><th>要求的值</th><th>量到的硬體</th><th>平行數</th><th>context 長度</th><th>同時載入模型數</th><th>flash attention</th><th>KV cache</th><th>結果</th></tr></thead>
            <tbody>${h.tunings.map((r) => `
              <tr>
                <td class="mono">${Proto.clock(r.at)}</td>
                <td>${r.trigger === "open" ? "開啟" : "套用"}</td>
                <td>${Proto.requestedText(r.requested)}</td>
                <td class="small">${r.machine ? Proto.machineText(r.machine) : "<span class=\"muted\">—</span>"}</td>
                ${effective(r)}
                <td><span class="pill ${TUNING_RESULT[r.result].pill}">${TUNING_RESULT[r.result].text}</span>${note(r)}</td>
              </tr>`).join("")}</tbody>
          </table>`
        : "<p class=\"muted\">這個工作階段沒有 Ollama 設定的紀錄(在加入這項功能之前開的)。</p>";
    };

    const render = () => {
      const list = sessions();
      if (list.length === 0) {
        Proto.hideGroup("detail");
        return Proto.showState("empty");
      }
      Proto.showState("normal");
      document.getElementById("rows").innerHTML = list.map((h, i) => {
        const end = h.endedAt ? Date.parse(h.endedAt) : Proto.now();
        return `
          <tr class="history-row ${openIndex === i ? "is-open" : ""}" data-row="${i}">
            <td>${Proto.dateTime(h.openedAt)}<br><span class="mono small muted">${h.name}</span></td>
            <td>${h.endedAt ? Proto.dateTime(h.endedAt) : "—"}</td>
            <td>${Proto.typeText(h.runtimeType)}</td>
            <td>${statePill(h)}</td>
            <td class="num">${Proto.duration(end - Date.parse(h.openedAt))}</td>
          </tr>`;
      }).join("");
      if (openIndex !== null && list[openIndex]) {
        renderDetail(list[openIndex]);
        Proto.showState("tuning-log");
      } else Proto.hideGroup("detail");
    };

    document.getElementById("rows").addEventListener("click", (event) => {
      const row = event.target.closest("[data-row]");
      if (!row) return;
      const i = Number(row.dataset.row);
      openIndex = openIndex === i ? null : i;
      render();
    });
    document.getElementById("d-close").addEventListener("click", () => {
      openIndex = null;
      render();
    });
    document.addEventListener("DOMContentLoaded", () => {
      const tick = () => {
        Proto.badge();
        render();
        Proto.later(2000, tick);
      };
      tick();
    });
  </script>
</body>
</html>
