openapi: 3.1.0
info:
  title: Ollama 相容端點
  version: 0.1.0
  description: >-
    S6(E3 Ollama 相容端點)依 spec.md 與 plan.md 產出。

    本系統自己對外的 HTTP 介面:家中區網的程式把它當成一般的 Ollama 服務設定一次(FR-011),
    請求轉送到目前「就緒」的工作階段上的遠端 Ollama(S1 `remote-ollama.openapi.yaml`),換了執行環境也不用改設定。
    只開放給家中區網(含 VPN 連回),不需要登入(NFR-009);遠端 Ollama 只經 SSH 本機轉發存取,
    本端點不回傳、不轉址到任何遠端位址(NFR-003)。和 UI API(S5)是不同的 port,port 號碼由 S11 決定。

    處理順序,每個請求都一樣:
    (1)路徑是管理模型的操作(`/api/pull`、`/api/push`、`/api/create`、`/api/copy`、`/api/delete`、`/api/blobs/{digest}`)
    → 不論方法與工作階段狀態,立即回 403 `MANAGED_IN_UI`,不轉送(FR-012、FR-013、research.md R8);
    (2)路徑不在白名單(本檔 `paths` 列出的推論與查詢路徑:`/`、`/api/version`、`/api/tags`、`/api/ps`、`/api/show`、
    `/api/generate`、`/api/chat`、`/api/embed`、`/api/embeddings`)→ 不論工作階段狀態,立即回 404 `PATH_NOT_SUPPORTED`,不轉送(見 `x-unlisted-paths`);
    (3)推論或查詢請求,但沒有「就緒」的工作階段(含開啟中、重連中、變更類型的過程中)→ 1 秒內回 503 `NO_READY_SESSION`,
    不排隊等待(FR-013、SC-007);
    (4)其他請求原樣轉送(白名單之內;research.md R8 的轉送代理):方法、路徑、query、本文與標頭照送,`Host` 改成遠端轉發的位址,
    hop-by-hop 標頭(`Connection`、`Transfer-Encoding` 等)不轉;回應的狀態碼、標頭與本文原樣傳回,串流逐段傳回、不緩衝。
    `Origin` 標頭也照送:遠端 Ollama 由 S8 的啟動步驟設 `OLLAMA_ORIGINS=*`(plan.md Q20),
    所以帶 `Origin` 的瀏覽器程式(例如區網網頁 `http://192.168.0.50:3000`)也能用,遠端照它的 CORS 處理回應標頭,本端點原樣傳回。
    (沒有這個設定時,遠端 Ollama 對不在允許清單內的 `Origin` 回 403、本文為空,桌機 Ollama 0.32.15 實測。)
    轉送增加的延遲,單次非串流請求不超過 0.5 秒(NFR-004、SC-005;research.md R8 實測差距在雜訊內)。

    本檔列出的是 FR-011 點名的推論與查詢操作(白名單)與 FR-012 的管理操作(plan.md Q18 決定用白名單)。
    其他路徑一律不轉送,包含 Ollama 本身提供的 `/v1/*`(OpenAI 相容 API;spec 假設「不另外提供 OpenAI 相容 API」)、
    `/api/status`、`/api/me`、`/api/signout`、`/api/experimental/*` 等,回 404 `PATH_NOT_SUPPORTED`。
    白名單只看路徑:白名單路徑用錯方法(例如 `POST /api/tags`)照轉送,回遠端 Ollama 自己的 405(桌機 Ollama 0.32.15 實測)。

    錯誤本文:為了相容 Ollama 用戶端,錯誤一律沿用 Ollama 的 `{"error": "<說明>"}`(schema `OllamaError`)。
    本系統自己產生的錯誤(403、404 `PATH_NOT_SUPPORTED`、502、503、504 與串流中途補的那一行)`error` 是給使用者看的繁體中文;
    遠端 Ollama 回的 4xx、5xx 原樣傳回,`error` 是 Ollama 的英文說明,本系統不改寫。
    各回應的 `x-error-codes` 是這個錯誤的原因代碼(schema `Error` 列出全部代碼),**不出現在回應本文裡**;
    外部依賴的失敗沿用 S1 轉接層的 `OLLAMA_` 代碼,和 UI API(S5)同一個原因用同一個代碼。
    S1 的 `OLLAMA_BAD_RESPONSE` 不會出現在這裡:本端點不解析遠端的回應本文,形狀不符也原樣傳回;
    `OLLAMA_PULL_FAILED` 也不會出現,因為 `/api/pull` 被阻擋。

    閒置計時(FR-026):工作階段「就緒」時,本端點收到的任何請求(含被阻擋的管理操作與白名單外的路徑)都重設閒置計時;
    請求進行中(含串流)不計入閒置,回應結束時再重設一次。503 的請求發生在沒有就緒的工作階段時,沒有計時可重設。
    各操作的 `x-idle-timer` 寫出它對計時的作用。

    同時有多個請求時,照遠端 Ollama 本身的處理方式排隊與並行,本端點不另外限制(spec 假設)。
x-unlisted-paths:
  description: >-
    白名單外的每一個路徑(本檔 `paths` 沒有列出的),不論方法與工作階段狀態,一律不轉送、不讀請求本文,立即回 404(plan.md Q18)。
    和遠端 Ollama 自己的 `404 page not found` 不同:本端點回 JSON。
  x-requirements: [FR-011, FR-026]
  x-callers: 家中區網(含 VPN 連回)的任何程式,不需要登入(NFR-009)
  x-idle-timer: 工作階段「就緒」時,收到請求即重設閒置計時(FR-026「任何經 Ollama 相容端點的請求」)
  responses:
    '404':
      description: >-
        這個路徑不在 Ollama 相容端點開放的範圍。`error` 例如「Ollama 相容端點不提供 /v1/chat/completions;
        只開放 Ollama 的推論與查詢 API(/api/generate、/api/chat、/api/embed、/api/tags 等)」。
      x-error-codes: [PATH_NOT_SUPPORTED]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OllamaError'
servers:
  - url: http://{host}:{port}
    description: 本系統所在主機的區網位址;Ollama 相容端點專用的 port,和 UI API 分開,號碼由 S11 決定
    variables:
      host:
        default: 本系統所在主機
        description: 本系統所在主機的區網 IP 或主機名稱
      port:
        default: 由 S11 決定
        description: Ollama 相容端點的 port(S11 決定;規格檔不寫死)
paths:
  /:
    get:
      operationId: getRoot
      summary: Ollama 存活檢查
      description: >-
        Ollama 用戶端與常見工具(例如 Open WebUI)用來確認位址上有 Ollama;原樣轉送,遠端回 `text/plain` 的 `Ollama is running`(桌機實測)。
        沒有就緒的工作階段時和其他推論與查詢路徑一樣回 503,呼叫者看到的是「目前不能用」,不是「有 Ollama 但每個請求都失敗」。
      x-requirements: [FR-011, FR-013, FR-026, NFR-003, NFR-004, SC-005, SC-007]
      x-callers: 家中區網(含 VPN 連回)的任何程式,不需要登入(NFR-009);轉送只在工作階段「就緒」時進行
      x-forwards-to: remote-ollama.openapi.yaml GET /(S1)
      x-timeout: 5 秒(比照 S1 `/api/version`,Q5)
      x-idle-timer: 收到請求即重設閒置計時;請求進行中(含串流)不計入閒置,回應結束時再重設一次
      responses:
        '200':
          description: 遠端 Ollama 的存活回應,原樣傳回
          x-recipients: 呼叫者(送出這個請求的區網程式)
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RootResponse'
        '502':
          description: >-
            工作階段是「就緒」,但連不到遠端 Ollama(本機轉發沒有在聽、連線被拒、SSH 通道剛斷、健康檢查還沒偵測到),
            還沒收到任何 HTTP 回應。`error` 例如「連不到 Colab 上的模型服務,工作階段可能正在重連,請稍後再試」。
          x-error-codes: [OLLAMA_UNREACHABLE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '503':
          description: >-
            收到這個推論或查詢請求時,沒有「就緒」的工作階段(沒有工作階段、開啟中、重連中、開啟失敗、失聯、已結束,或變更執行階段類型的過程中);
            不排隊、不轉送,1 秒內回應(FR-013、SC-007)。`error` 例如「目前沒有可用的工作階段:工作階段重連中,請稍後再試,或到 UI 查看狀態」,
            括號裡的狀態依當下而定,代碼一律相同。
          x-error-codes: [NO_READY_SESSION]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '504':
          description: >-
            連上遠端 Ollama,但在這個操作的 `x-timeout` 內沒有收到回應(串流時是兩段之間超過逾時)。
            `error` 例如「Colab 上的模型服務沒有在時限內回應」。
          x-error-codes: [OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
    head:
      operationId: headRoot
      summary: Ollama 存活檢查(HEAD)
      description: >-
        Ollama 官方用戶端的 heartbeat 以 `HEAD /` 確認服務在線;原樣轉送,只回狀態碼與標頭。
      x-requirements: [FR-011, FR-013, FR-026, NFR-003, NFR-004, SC-005, SC-007]
