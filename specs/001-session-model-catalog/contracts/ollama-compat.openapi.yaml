components:
  schemas:
    RootResponse:
      type: string
      description: 遠端 Ollama 的存活回應(桌機實測)
      enum: [Ollama is running]
    VersionResponse:
      type: object
      required: [version]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點原樣轉送
      properties:
        version:
          type: string
          description: 執行環境上 Ollama 的版本,例如 0.40.15
    TagsResponse:
      type: object
      required: [models]
      additionalProperties: true
      description: 照 S1 同名 schema 原文(每個元素是 S1 的 `LocalModel`);本端點原樣轉送
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/LocalModel'
    LocalModel:
      type: object
      required: [name, model, modified_at, size, digest]
      additionalProperties: true
      description: 照 S1 同名 schema 原文,完整欄位見 S1
      properties:
        name:
          type: string
          description: 模型名稱含版本,例如 qwen2.5:7b
        model:
          type: string
        modified_at:
          type: string
          format: date-time
        size:
          type: integer
          minimum: 0
          description: 模型在磁碟上的大小,位元組
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
    PsResponse:
      type: object
      required: [models]
      additionalProperties: true
      description: 照 S1 同名 schema 原文(每個元素是 S1 的 `LoadedModel`,完整欄位見 S1);本端點原樣轉送
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [name, model, size, digest, expires_at, size_vram]
    ShowRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點不讀內容,原樣轉送
      properties:
        model:
          type: string
        verbose:
          type: boolean
    ShowResponse:
      type: object
      additionalProperties: true
      description: 照 S1 同名 schema 原文,完整欄位見 S1;本端點原樣轉送,不解讀內容
    GenerateRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點不讀內容,所有欄位原樣轉送
      properties:
        model:
          type: string
        prompt:
          type: string
        stream:
          type: boolean
          default: true
    GenerateResponse:
      type: object
      required: [model, created_at, done]
      additionalProperties: true
      description: 照 S1 同名 schema 原文,完整欄位見 S1;串流時是 NDJSON 的一行
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        response:
          type: string
        done:
          type: boolean
          description: 串流的最後一行是 true
    ChatRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點不讀內容,所有欄位原樣轉送
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: true
    ChatResponse:
      type: object
      required: [model, created_at, done]
      additionalProperties: true
      description: 照 S1 同名 schema 原文,完整欄位見 S1;串流時是 NDJSON 的一行
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        message:
          type: object
          additionalProperties: true
        done:
          type: boolean
    EmbedRequest:
      type: object
      required: [model, input]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點不讀內容,原樣轉送
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
    EmbedResponse:
      type: object
      required: [model, embeddings]
      additionalProperties: true
      description: 照 S1 同名 schema 原文
      properties:
        model:
          type: string
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
    EmbeddingsRequest:
      type: object
      required: [model, prompt]
      additionalProperties: true
      description: 照 S1 同名 schema 原文;本端點不讀內容,原樣轉送
      properties:
        model:
          type: string
        prompt:
          type: string
    EmbeddingsResponse:
      type: object
      required: [embedding]
      description: 照 S1 同名 schema 原文
      properties:
        embedding:
          type: array
          items:
            type: number
    OllamaError:
      type: object
      required: [error]
      description: >-
        本端點所有錯誤回應的本文,和 Ollama 的錯誤本文相同(S1 同名 schema),Ollama 用戶端照它處理錯誤。
        本系統產生的錯誤 `error` 是繁體中文;遠端 Ollama 原樣傳回的錯誤是英文。沒有錯誤碼欄位。
      properties:
        error:
          type: string
    Error:
      type: object
      required: [code]
      description: >-
        本端點全部錯誤的原因代碼目錄,寫在各回應的 `x-error-codes` 與 `x-stream-error-codes`,**不出現在回應本文裡**
        (回應本文是 `OllamaError`)。`NO_READY_SESSION`、`MANAGED_IN_UI` 與 UI API(S5)共用;`OLLAMA_` 開頭的照 S1 原文。
      properties:
        code:
          type: string
          enum: [MANAGED_IN_UI, PATH_NOT_SUPPORTED, NO_READY_SESSION, OLLAMA_UNREACHABLE, OLLAMA_TIMEOUT, OLLAMA_BAD_REQUEST, OLLAMA_NOT_FOUND, OLLAMA_SERVER_ERROR, OLLAMA_STREAM_INTERRUPTED]
          x-enum-descriptions:
            MANAGED_IN_UI: 管理模型的操作(下載、刪除、建立、複製、推送)被本端點擋下,要到 UI 進行;HTTP 403
            PATH_NOT_SUPPORTED: 路徑不在白名單(FR-011 點名的推論與查詢路徑以外,例如 `/v1/*`、`/api/me`),本端點不轉送;HTTP 404。和 `OLLAMA_NOT_FOUND`(模型不存在)是不同原因
            NO_READY_SESSION: 收到推論或查詢請求,但沒有「就緒」的工作階段(含重連中);HTTP 503。請求進行中工作階段被結束時,也是串流最後補的那一行的代碼
            OLLAMA_UNREACHABLE: 照 S1。工作階段就緒但連不到遠端 Ollama,還沒收到任何 HTTP 回應;HTTP 502
            OLLAMA_TIMEOUT: 照 S1。連上了,但在逾時內沒有收到回應;HTTP 504
            OLLAMA_BAD_REQUEST: 照 S1。遠端 Ollama 回 400,原樣傳回
            OLLAMA_NOT_FOUND: 照 S1。指名的模型不在執行環境上,遠端 Ollama 回 404,原樣傳回;不自動下載(FR-016)
            OLLAMA_SERVER_ERROR: 照 S1。遠端 Ollama 回 500(例如記憶體不足),原樣傳回
            OLLAMA_STREAM_INTERRUPTED: 照 S1。串流已經開始,在最後一行之前與執行環境的連線中斷;本端點在 NDJSON 最後補一行 `OllamaError` 後關閉
