          x-error-codes: [OLLAMA_BAD_REQUEST]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '404':
          description: >-
            指名的模型不在執行環境上,不自動下載(FR-016;照 S1 同一路徑的 404,例如 `{"error":"model 'x' not found"}`)。遠端 Ollama 的狀態碼與本文原樣傳回(英文說明,本系統不改寫)。
          x-error-codes: [OLLAMA_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '500':
          description: >-
            載入或推論失敗,例如顯示記憶體或磁碟不足;已載入的其他模型不受影響(spec 邊界情況;照 S1 同一路徑的 500)。遠端 Ollama 的狀態碼與本文原樣傳回(英文說明,本系統不改寫)。
          x-error-codes: [OLLAMA_SERVER_ERROR]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '502':
          description: >-
            工作階段是「就緒」,但連不到遠端 Ollama(本機轉發沒有在聽、連線被拒、SSH 通道剛斷、健康檢查還沒偵測到),
            還沒收到任何 HTTP 回應。`error` 例如「連不到 Colab 上的模型服務,工作階段可能正在重連,請稍後再試」。
          x-error-codes: [OLLAMA_UNREACHABLE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '503':
          description: >-
            收到這個推論或查詢請求時,沒有「就緒」的工作階段(沒有工作階段、開啟中、重連中、開啟失敗、失聯、已結束,或變更執行階段類型的過程中);
            不排隊、不轉送,1 秒內回應(FR-013、SC-007)。`error` 例如「目前沒有可用的工作階段:工作階段重連中,請稍後再試,或到 UI 查看狀態」,
            括號裡的狀態依當下而定,代碼一律相同。
          x-error-codes: [NO_READY_SESSION]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
        '504':
          description: >-
            連上遠端 Ollama,但在這個操作的 `x-timeout` 內沒有收到回應(串流時是兩段之間超過逾時)。
            `error` 例如「Colab 上的模型服務沒有在時限內回應」。
          x-error-codes: [OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OllamaError'
