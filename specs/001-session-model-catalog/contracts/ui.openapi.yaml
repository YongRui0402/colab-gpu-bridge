  /downloads/clear-completed:
    post:
      operationId: clearCompletedDownloads
      summary: 清除已完成的項目
      description: >-
        Q49:把佇列裡所有 `completed` 的項目從清單清掉(執行環境上的模型不受影響);排隊中、下載中、失敗的項目不動。
        沒有已完成的項目時回空的 `removedIds`。每一筆清掉的項目推送一則 `download.removed`。
      x-requirements: [FR-021]
      x-callers: UI(家中區網的任何瀏覽器,不需登入);不需要工作階段
      responses:
        '200':
          description: 被清掉的項目 id
          x-recipients: 呼叫者(UI);每一筆也以 `download.removed` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemovedDownloads'
  /downloads/{id}:
    delete:
      operationId: removeDownload
      summary: 移除單一項目(取消排隊中的,或清掉已完成、已失敗的)
      description: >-
        FR-021、使用者故事 3 驗收情境 11:排隊中的項目取消並從佇列移除;正在下載的不能取消。
        已完成或已失敗的項目從清單清掉(執行環境上的模型不受影響);這是 Q49 原型的「移除」。
        失敗項目的「重新排隊」用 `retryDownload`,一次清掉全部已完成的用 `clearCompletedDownloads`。移除後推送 `download.removed`。
      x-requirements: [FR-021]
      x-callers: UI;項目不是下載中
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '204':
          description: 已移除
          x-recipients: 呼叫者(UI)
        '404':
          description: 佇列沒有這一筆
          x-error-codes: [DOWNLOAD_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 這一筆正在下載,不能取消
          x-error-codes: [DOWNLOAD_IN_PROGRESS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      summary: 重新下載一筆失敗的項目
      description: >-
        失敗的項目(含工作階段結束而中斷的,spec 邊界情況「可再下載」)重新排到佇列最後,狀態回到排隊中。
        和 `enqueueDownloads` 一樣先檢查剩餘磁碟。
      x-requirements: [FR-017, FR-021, FR-022]
      x-callers: UI;工作階段「就緒」,項目是失敗
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 重新排隊的那一筆
          x-recipients: 呼叫者(UI);也以 `download.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJob'
        '404':
          description: 佇列沒有這一筆
          x-error-codes: [DOWNLOAD_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 這一筆不是失敗(排隊中、下載中或已完成);模型已經在執行環境上;總大小超過剩餘磁碟空間
          x-error-codes: [DOWNLOAD_NOT_RETRYABLE, MODEL_ALREADY_DOWNLOADED, DISK_SPACE_INSUFFICIENT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 確認執行環境上已有的模型時連不到遠端 Ollama 或回應格式不對
          x-error-codes: [OLLAMA_UNREACHABLE, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 沒有就緒的工作階段;讀不到執行環境的剩餘磁碟空間
          x-error-codes: [NO_READY_SESSION, DISK_SPACE_UNKNOWN]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 遠端 Ollama 在逾時內沒有回應
          x-error-codes: [OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /usage:
    get:
      operationId: getUsage
      summary: 查 compute units 餘額與每小時耗用
      description: >-
        FR-024、FR-025、NFR-008:後端至少每 5 分鐘自動讀一次帳號用量(S8 的 `colab usage`),這裡回傳最後一次的結果,
        有變化時推送 `usage.updated`。`readAt` 超過 15 分鐘時 `stale` 為 true,UI 標示為過期。
        餘額低於警告門檻時 `lowBalance` 為 true,只是警告,不阻止開啟、也不自動結束(FR-025)。
        讀取失敗時照 Q119:之前讀到過的,照樣回最後一次讀到的快照(`state` 為 `known`、原本的數值與 `readAt`),
        `readAt` 超過 15 分鐘就 `stale` 為 true,並以 `reasonCode`、`message`、`lastFailedAt` 說明最近一次讀取失敗;
        從來沒讀到過時 `state` 才是 `unknown`(數值與 `readAt` 都是 null),同樣以這三個欄位說明原因(使用者故事 4 驗收情境 5)。
        兩種情況都不影響開啟與結束。下一次讀取成功時,這三個欄位回到 null。
      x-requirements: [FR-024, FR-025, NFR-008]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '200':
          description: 最後一次讀到的用量
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'
  /settings:
    get:
      operationId: getSettings
      summary: 查設定
      x-requirements: [FR-027]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '200':
          description: 閒置時限與餘額警告門檻
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
    put:
      operationId: updateSettings
      summary: 修改設定
      description: >-
        FR-027、使用者故事 4 驗收情境 6:儲存後立即生效。閒置倒數改依新的時限計算(以最後一次請求時間起算;
        新時限已經到了就立即自動結束),餘額警告依新的門檻判斷;推送 `settings.updated`,以及受影響的 `session.updated`、`usage.updated`。
      x-requirements: [FR-026, FR-027, FR-025]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Settings'
      responses:
        '200':
          description: 儲存後的設定
          x-recipients: 呼叫者(UI);也以 `settings.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          description: 本文不是合法 JSON 或缺少欄位;閒置時限不是 1 到 1440 分鐘的整數;餘額警告門檻不是 0 到 10000 的數字
          x-error-codes: [INVALID_REQUEST_BODY, INVALID_IDLE_TIMEOUT, INVALID_BALANCE_THRESHOLD]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /events:
    get:
      operationId: subscribeEvents
      summary: 訂閱狀態推送(SSE)
      description: >-
        開一條 `text/event-stream`;事件的名稱、內容、快照與重連規則見 `ui-events.asyncapi.yaml`。
        連上後先收到各資源的快照,之後只在有變化時推送(FR-003、NFR-001、FR-021、FR-024、FR-026)。
      x-requirements: [FR-003, FR-021, FR-024, FR-026, NFR-001, NFR-009]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '200':
          description: SSE 串流,不會主動結束
          x-recipients: 呼叫者(UI);所有連著的 UI 收到相同的事件
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 格式,`event:` 為訊息名稱、`data:` 為一行 JSON
components:
  schemas:
    GpuType:
      type: string
      enum: [T4, L4, G4, A100, H100]
      description: 可選的 GPU(Colab CLI `colab new --gpu` 支援的類型,research.md R1);TPU 不在範圍內
    RuntimeType:
      type: object
      required: [gpu, highMem]
      properties:
        gpu:
          $ref: '#/components/schemas/GpuType'
        highMem:
          type: boolean
          description: 是否高 RAM;L4 時 Colab 會忽略這個選項(research.md R1),工作階段照樣記錄使用者選的值
    OpenSessionInput:
      type: object
      required: [runtimeType]
      properties:
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
          description: UI 預設 T4、不開高 RAM(FR-009)
    SessionState:
      type: string
      enum: [none, opening, ready, reconnecting, ending, ended, open_failed, lost]
      description: >-
        UI 依序顯示為:未開啟、開啟中、就緒、重連中、結束中、已結束、開啟失敗、失聯(FR-003)。
        `ended`、`open_failed`、`lost` 一定有 `endReason`。
        時間門檻(SC-002,Q57):執行環境被 Colab 收回時,2 分鐘內變成 `lost`(`RECLAIMED_BY_COLAB`);
        單純連線中斷時,1 分鐘內變成 `reconnecting`,重連時限(固定 5 分鐘)到了仍接不回才變成 `lost`(`RECONNECT_TIMEOUT`)。
        開啟中超過 5 分鐘變成 `open_failed`(SC-001,Q58)。
    OpeningStep:
      type: string
      enum: [ending_previous, allocating, starting_ollama, connecting, verifying]
      description: >-
        開啟中進行到哪一步(NFR-001):結束原本的執行環境(只在變更類型時)、在 Colab 配置執行環境、安裝並啟動 Ollama、
        建立通道、確認模型服務可回應
    EndReason:
      type: string
      enum: [USER_ENDED, IDLE_TIMEOUT, RUNTIME_TYPE_CHANGED, OPEN_FAILED, RECLAIMED_BY_COLAB, RECONNECT_TIMEOUT]
      description: >-
        使用者結束、閒置自動結束、變更執行階段類型而結束、開啟失敗、被 Colab 收回、重連逾時
    ReasonCode:
      type: string
      pattern: '^((COLAB|TUNNEL|OLLAMA|LIBRARY|OAUTH)_[A-Z0-9_]+|AUTH_REQUIRED)$'
      description: >-
        外部依賴失敗的轉接層代碼,照原文沿用:`OLLAMA_`(S1)、`LIBRARY_`(S2)、`OAUTH_`(S3)、`COLAB_`(S8)、`TUNNEL_`(S9);
        各前綴底下的代碼以各步驟的規格檔為準,本檔不另列舉。
        另外允許 `AUTH_REQUIRED`(Q61):S8 偵測到 Colab CLI 的授權失效時回它,與本介面 `openSession` 的 409 `AUTH_REQUIRED` 同一個原因、同一個代碼(Q26)
    ReleaseWarning:
      type: object
      required: [message, detectedAt]
      description: FR-007:確認或釋放由本系統開啟的執行環境失敗,Colab 帳號下可能還有遺留,會繼續扣 compute units
      properties:
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
        message:
          type: string
          description: 給使用者看的繁體中文說明,例如請到 Colab 網頁手動結束
        detectedAt:
          type: string
          format: date-time
    UnmanagedRuntime:
      type: object
      required: [hardware, detectedAt]
      description: >-
        Colab 帳號下運作中、但不是本系統開啟的執行環境(spec 邊界情況:不接手、不關閉,只提示);不含名稱與位址
      properties:
        hardware:
          type: string
          description: Colab 報的硬體類型,例如 T4
        detectedAt:
          type: string
          format: date-time
    IdleCountdown:
      type: object
      required: [timeoutMinutes, activeRequests, lastRequestAt, deadline]
      description: >-
        FR-026、使用者故事 4 驗收情境 4,算法照 Q24:閒置只以 Ollama 相容端點(S6)的請求為準,UI API 的呼叫不算。
        任何經 Ollama 相容端點的請求(含被擋下的管理操作)開始時重設;請求進行中(含串流回應)不計閒置,
        這時 `activeRequests` 大於 0、`deadline` 為 null;最後一個進行中的請求結束時再重設一次,
        `deadline` = 那個時間 + `timeoutMinutes`。UI 以 `deadline` 自己倒數;
        `activeRequests` 由 0 變成大於 0、或回到 0 時推送 `session.updated`,其他重設最多每 5 秒推一次
      properties:
        activeRequests:
          type: integer
          minimum: 0
          description: Ollama 相容端點目前進行中的請求數(含串流中)
        timeoutMinutes:
          type: integer
          minimum: 1
          maximum: 1440
        lastRequestAt:
          type: string
          format: date-time
          description: 最後一次重設的時間(請求開始或最後一個進行中的請求結束);沒有任何請求時是就緒的時間
        deadline:
          type: [string, 'null']
          format: date-time
          description: 自動結束的時間;有請求進行中時為 null(不計閒置)
    Reconnect:
      type: object
      required: [startedAt, deadline]
      description: >-
        FR-004:重連中時開始的時間與重連時限到期的時間。重連時限固定 5 分鐘,不能設定(Q67);
        到期仍接不回就變成 `lost`(`RECONNECT_TIMEOUT`),期間確認執行環境已被收回則提早變成 `lost`(`RECLAIMED_BY_COLAB`)
      properties:
        startedAt:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
    Session:
      type: object
      required: [state]
      description: 目前(或最近一次)的工作階段;`state` 為 `none` 時其他欄位都沒有
      properties:
        state:
          $ref: '#/components/schemas/SessionState'
        name:
          type: string
          pattern: '^cgb-[a-z0-9-]{1,60}$'
          description: 工作階段的識別名稱(本系統產生,research.md R1)
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        step:
          oneOf:
            - $ref: '#/components/schemas/OpeningStep'
            - type: 'null'
          description: 只在 `opening` 時有值
        endReason:
          oneOf:
            - $ref: '#/components/schemas/EndReason'
            - type: 'null'
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: 開啟失敗或失聯的外部原因(例如沒有可用的 GPU、帳號授權失效),沒有時為 null
        message:
          type: [string, 'null']
          description: 給使用者看的繁體中文說明(開啟失敗的原因、失聯後可以重新開啟的提示等)
        openedAt:
          type: string
          format: date-time
        readyAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        durationSeconds:
          type: integer
          minimum: 0
          description: 運行時長,從開啟到結束(還沒結束時到現在),秒
        idle:
          oneOf:
            - $ref: '#/components/schemas/IdleCountdown'
            - type: 'null'
          description: 只在 `ready` 時有值
        reconnect:
          oneOf:
            - $ref: '#/components/schemas/Reconnect'
            - type: 'null'
          description: 只在 `reconnecting` 時有值
        releaseWarning:
          oneOf:
            - $ref: '#/components/schemas/ReleaseWarning'
            - type: 'null'
        balanceMayBeDepleted:
          type: boolean
          description: 重連中或失聯時,最後讀到的餘額小於等於 0;UI 額外提示餘額可能已歸零(spec 邊界情況)
        unmanagedRuntimes:
          type: array
          items:
            $ref: '#/components/schemas/UnmanagedRuntime'
    SessionRecord:
      type: object
      required: [name, runtimeType, state, openedAt, durationSeconds]
      properties:
        name:
          type: string
          pattern: '^cgb-[a-z0-9-]{1,60}$'
        runtimeType:
          $ref: '#/components/schemas/RuntimeType'
        state:
          $ref: '#/components/schemas/SessionState'
          description: 最後的狀態;還沒結束的那一筆是目前的狀態
        endReason:
          oneOf:
            - $ref: '#/components/schemas/EndReason'
            - type: 'null'
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
        openedAt:
          type: string
          format: date-time
        readyAt:
          type: [string, 'null']
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time
        durationSeconds:
          type: integer
          minimum: 0
          description: 運行時長,秒
    SessionHistoryPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SessionRecord'
        hasMore:
          type: boolean
    StateTransition:
      type: object
      required: [at, state]
      properties:
        at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/SessionState'
        step:
          oneOf:
            - $ref: '#/components/schemas/OpeningStep'
            - type: 'null'
        endReason:
          oneOf:
            - $ref: '#/components/schemas/EndReason'
            - type: 'null'
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
    SessionRecordDetail:
      allOf:
        - $ref: '#/components/schemas/SessionRecord'
        - type: object
          required: [transitions]
          properties:
            transitions:
              type: array
              description: 依時間排序的每一次狀態變化(FR-028)
              items:
                $ref: '#/components/schemas/StateTransition'
    AuthStatus:
      type: object
      required: [state, checkedAt]
      properties:
        state:
          type: string
          enum: [logged_in, logged_out, unknown]
          description: 已登入、未登入(含授權已過期,要重新登入)、確認不了
        checkedAt:
          type: string
          format: date-time
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: '`logged_out` 或 `unknown` 的原因(S8 的 `COLAB_` 代碼);已登入時為 null'
        message:
          type: [string, 'null']
          description: 給使用者看的繁體中文說明
    AuthorizationFlow:
      type: object
      required: [flowId, authorizationUrl, createdAt]
      properties:
        flowId:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,64}$'
          description: 這次授權流程的代號,送出授權碼時帶回
        authorizationUrl:
          type: string
          format: uri
          description: S3 `authorize` 組出的 `https://accounts.google.com/o/oauth2/auth?...` 完整網址
        createdAt:
          type: string
          format: date-time
    AuthorizationCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          maxLength: 2048
          description: 使用者從 Google 落地頁複製的授權碼
    ModelName:
      type: string
      pattern: '^[a-z0-9][a-z0-9._-]*(:[A-Za-z0-9_][A-Za-z0-9._-]*)?$'
      description: >-
        官方模型名稱,可帶 `:版本`(例 qwen2.5:7b);沒寫版本視為 `latest`。不接受社群模型的 `<使用者>/<名稱>`(Q9)
    PreloadState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, loading, failed]
          description: 沒有預先載入、載入中、上一次預先載入失敗
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
        message:
          type: [string, 'null']
    CatalogModel:
      type: object
      required: [name, sizeBytes, modifiedAt, loaded, mayNotFit, preload]
      properties:
        name:
          type: string
          description: 模型名稱含版本,照遠端 Ollama `/api/tags` 的 `name`
        sizeBytes:
          type: integer
          minimum: 0
          description: 模型在磁碟上的大小,位元組
        modifiedAt:
          type: string
          format: date-time
          description: 下載完成的時間
        loaded:
          type: boolean
          description: 目前是否已載入記憶體(遠端 Ollama `/api/ps`)
        mayNotFit:
          type: [boolean, 'null']
          description: NFR-006:大小超過顯示記憶體總量(`vramBytes`,Q62)時為 true,UI 標示「可能無法載入」;讀不到顯示記憶體時為 null
        preload:
          $ref: '#/components/schemas/PreloadState'
    ModelCatalog:
      type: object
      required: [items, vramBytes]
      properties:
        vramBytes:
          type: [integer, 'null']
          minimum: 0
          description: 目前執行環境 GPU 的顯示記憶體總量,位元組(S8 提供,Q7、Q62);讀不到時為 null
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModel'
    PreloadInput:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ModelName'
    LibraryModel:
      type: object
      required: [name, downloadedTags]
      properties:
        name:
          type: string
          description: 官方模型名稱(不含版本)
        description:
          type: [string, 'null']
          description: 模型庫的英文簡介,原樣顯示;解析不出來時為 null
        parameterSizes:
          type: array
          description: 搜尋頁標的參數量,例如 0.5b、7b;只用來顯示
          items:
            type: string
        capabilities:
          type: array
          description: 搜尋頁的能力標籤,例如 tools、vision
          items:
            type: string
        downloadedTags:
          type: array
          description: 執行環境上已有的版本(例如 7b),標示「已下載」
          items:
            type: string
    LibrarySearchPage:
      type: object
      required: [query, page, hasMore, runtimeChecked, items]
      properties:
        query:
          type: string
        page:
          type: integer
          minimum: 1
        hasMore:
          type: boolean
          description: 還有下一頁,UI 顯示「顯示更多」(Q1)
        runtimeChecked:
          type: boolean
          description: 有沒有對照執行環境上的模型;沒有就緒的工作階段時為 false
        items:
          type: array
          items:
            $ref: '#/components/schemas/LibraryModel'
    LibraryTag:
      type: object
      required: [tag, fullName, sizeLabel, downloaded, cloudOnly]
      properties:
        tag:
          type: string
          description: 版本名稱,例如 7b、latest
        fullName:
          type: string
          description: 名稱加版本,例如 qwen2.5:7b;加入下載時用這個
        sizeLabel:
          type: string
          description: 版本頁的大小顯示值,例如 4.7GB、398MB
        approxSizeBytes:
          type: [integer, 'null']
          minimum: 0
          description: 由顯示值換算的約略位元組數(1 GB 以 10^9 計),只用來顯示;解析不出來時為 null
        contextLength:
          type: [string, 'null']
          description: context 長度的顯示值,例如 32K
        downloaded:
          type: boolean
          description: 執行環境上已有這個版本
        cloudOnly:
          type: boolean
          description: 只能在 Ollama 雲端執行、不能下載的版本(名稱含 cloud)
    LibraryTagList:
      type: object
      required: [name, runtimeChecked, tags]
      properties:
        name:
          type: string
        runtimeChecked:
          type: boolean
        tags:
          type: array
          items:
            $ref: '#/components/schemas/LibraryTag'
    CuratedModelInput:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ModelName'
        description:
          type: string
          maxLength: 200
          description: 使用者寫的說明
        recommendedRuntimeType:
          oneOf:
            - $ref: '#/components/schemas/RuntimeType'
            - type: 'null'
    CuratedModel:
      type: object
      required: [id, name, downloaded]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          description: 模型名稱含版本(沒寫版本時存成 `<名稱>:latest`)
        description:
          type: [string, 'null']
        recommendedRuntimeType:
          oneOf:
            - $ref: '#/components/schemas/RuntimeType'
            - type: 'null'
        downloaded:
          type: boolean
          description: 執行環境上已有這個模型
    CuratedList:
      type: object
      required: [runtimeChecked, items]
      properties:
        runtimeChecked:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/CuratedModel'
    DownloadSelection:
      type: object
      required: [models]
      properties:
        models:
          type: array
          description: 勾選或輸入的模型名稱;重複的只算一次
          items:
            $ref: '#/components/schemas/ModelName'
    EstimateItem:
      type: object
      required: [name, sizeBytes]
      properties:
        name:
          type: string
          description: 名稱含版本(沒寫版本時補上 latest)
        sizeBytes:
          type: integer
          minimum: 0
          description: manifest `layers[].size` 的總和,位元組
    DownloadEstimate:
      type: object
      required: [items, totalBytes, pendingQueueBytes, freeDiskBytes, diskCheckedAt, fits, estimatedSeconds]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EstimateItem'
        totalBytes:
          type: integer
          minimum: 0
          description: 這次選取的總大小,位元組
        pendingQueueBytes:
          type: integer
          minimum: 0
          description: 佇列裡排隊中與下載中的項目還沒下載的大小,位元組
        freeDiskBytes:
          type: integer
          minimum: 0
          description: 執行環境的剩餘磁碟空間,位元組(S8 提供,Q7)
        diskCheckedAt:
          type: string
          format: date-time
        fits:
          type: boolean
          description: totalBytes 加 pendingQueueBytes 不超過 freeDiskBytes
        estimatedSeconds:
          type: integer
          minimum: 0
          description: 預估下載時間,秒;以 50 MB/s 估算(research.md R5),UI 標示為估計值
    DownloadProgress:
      type: object
      required: [completedBytes, totalBytes]
      properties:
        phase:
          type: string
          enum: [manifest, downloading, verifying, writing]
          description: 對應 pull 進度的 pulling manifest、pulling <digest>、verifying sha256 digest、writing manifest
        completedBytes:
          type: integer
          minimum: 0
          description: 各層已下載的位元組總和
        totalBytes:
          type: integer
          minimum: 0
          description: 各層的總大小
    DownloadJob:
      type: object
      required: [id, model, sizeBytes, state, origin, preloadOnComplete, addedAt]
      properties:
        id:
          type: integer
          minimum: 1
        model:
          type: string
          description: 模型名稱含版本
        sizeBytes:
          type: integer
          minimum: 0
          description: 加入時 manifest 算出的大小,位元組
        state:
          type: string
          enum: [queued, downloading, completed, failed]
          description: 排隊中、下載中、完成、失敗(已取消的直接從佇列移除,不會出現)
        progress:
          oneOf:
            - $ref: '#/components/schemas/DownloadProgress'
            - type: 'null'
          description: 只在 `downloading` 時有值;事件最多每秒推一次
        reasonCode:
          type: [string, 'null']
          description: >-
            失敗原因:S1 的 `OLLAMA_` 代碼(例如 `OLLAMA_NOT_FOUND`、`OLLAMA_PULL_FAILED`、`OLLAMA_STREAM_INTERRUPTED`、`OLLAMA_TIMEOUT`),
            或本系統的 `SESSION_ENDED`(工作階段結束或失聯而中斷)、`DISK_SPACE_INSUFFICIENT`(自動繼續時空間不足)
        message:
          type: [string, 'null']
          description: 給使用者看的繁體中文失敗說明
        origin:
          type: string
          enum: [user, restore]
          description: 使用者加入的,或變更類型時為了重新載入原本的模型而加入的(FR-010)
        preloadOnComplete:
          type: boolean
          description: 下載完成後自動預先載入(`origin` 為 `restore` 時為 true)
        addedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    DownloadJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DownloadJob'
    RemovedDownloads:
      type: object
      required: [removedIds]
      properties:
        removedIds:
          type: array
          items:
            type: integer
            minimum: 1
    DownloadQueue:
      type: object
      required: [paused, jobs]
      properties:
        paused:
          type: boolean
          description: 沒有就緒的工作階段,排隊中的項目暫停
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DownloadJob'
    Usage:
      type: object
      required: [state, stale, lowBalance, warningThreshold]
      properties:
        state:
          type: string
          enum: [known, unknown]
          description: >-
            `known`:至少讀到過一次,數值是最後一次讀到的快照(最近一次讀取失敗也照樣是 `known`,Q119);
            `unknown`:從來沒讀到過(UI 顯示「未知」)
        balance:
          type: [number, 'null']
          description: compute units 餘額
        ratePerHour:
          type: [number, 'null']
          minimum: 0
          description: 目前每小時耗用的 compute units
        hoursRemaining:
          type: [number, 'null']
          minimum: 0
          description: 估計還能用的時數(餘額 ÷ 每小時耗用);耗用為 0 時為 null
        readAt:
          type: [string, 'null']
          format: date-time
          description: 最後一次讀取成功的時間;讀取失敗時不更新;`unknown` 時為 null
        stale:
          type: boolean
          description: NFR-008:readAt 超過 15 分鐘(包含之後的讀取一直失敗而沒有更新的情況);`unknown` 時為 false
        lowBalance:
          type: boolean
          description: 餘額低於警告門檻(FR-025)
        warningThreshold:
          type: number
          minimum: 0
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: 最近一次讀取失敗的原因(S8 的 `COLAB_` 代碼,或 `AUTH_REQUIRED`);最近一次讀取成功時為 null
        message:
          type: [string, 'null']
          description: 給使用者看的繁體中文說明,說明最近一次讀取失敗;最近一次讀取成功時為 null
        lastFailedAt:
          type: [string, 'null']
          format: date-time
          description: 最近一次讀取失敗的時間(Q119);最近一次讀取成功時為 null
    Settings:
      type: object
      required: [idleTimeoutMinutes, lowBalanceThreshold]
      properties:
        idleTimeoutMinutes:
          type: integer
          minimum: 1
          maximum: 1440
          default: 30
          description: 閒置時限,分鐘;預設 30
        lowBalanceThreshold:
          type: number
          minimum: 0
          maximum: 10000
          default: 10
          description: 餘額警告門檻,compute units;預設 10
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST_BODY
            - INVALID_AUTH_CODE
            - AUTH_LINK_EXPIRED
            - AUTH_REQUIRED
            - INVALID_RUNTIME_TYPE
            - SESSION_ALREADY_ACTIVE
            - SESSION_ENDING
            - NO_ACTIVE_SESSION
            - NO_READY_SESSION
            - INVALID_LIMIT
            - INVALID_BEFORE
            - SESSION_NOT_FOUND
            - INVALID_MODEL_NAME
            - INVALID_QUERY
            - INVALID_PAGE
            - INVALID_CURATED_DESCRIPTION
            - CURATED_DUPLICATE
            - CURATED_NOT_FOUND
            - EMPTY_MODEL_LIST
            - MODEL_ALREADY_DOWNLOADED
            - DOWNLOAD_ALREADY_QUEUED
            - DISK_SPACE_INSUFFICIENT
            - DISK_SPACE_UNKNOWN
            - DOWNLOAD_NOT_FOUND
            - DOWNLOAD_IN_PROGRESS
            - DOWNLOAD_NOT_RETRYABLE
            - INVALID_IDLE_TIMEOUT
            - INVALID_BALANCE_THRESHOLD
            - OLLAMA_UNREACHABLE
            - OLLAMA_TIMEOUT
            - OLLAMA_BAD_RESPONSE
            - OLLAMA_NOT_FOUND
            - LIBRARY_UNREACHABLE
            - LIBRARY_TIMEOUT
            - LIBRARY_BAD_RESPONSE
            - LIBRARY_NOT_FOUND
            - LIBRARY_CLOUD_ONLY
            - LIBRARY_SERVER_ERROR
            - OAUTH_UNREACHABLE
            - OAUTH_TIMEOUT
            - OAUTH_BAD_RESPONSE
            - OAUTH_INVALID_GRANT
            - OAUTH_INVALID_REQUEST
            - OAUTH_INVALID_CLIENT
            - OAUTH_UNAUTHORIZED_CLIENT
            - OAUTH_UNSUPPORTED_GRANT_TYPE
            - OAUTH_INVALID_SCOPE
            - OAUTH_SCOPE_NOT_GRANTED
            - OAUTH_SERVER_ERROR
          description: >-
            `OLLAMA_`、`LIBRARY_`、`OAUTH_` 開頭的照 S1、S2、S3 原文沿用;其他是本介面自己把關的條件。
            `NO_READY_SESSION` 與 S6 共用(沒有就緒的工作階段,含開啟中與重連中,HTTP 503)
        message:
          type: string
          description: 給使用者看的繁體中文說明
        model:
          type: string
          description: 下載相關的錯誤指出是哪一個模型
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
          description: '`DISK_SPACE_UNKNOWN` 的外部原因(S8 的 `COLAB_` 代碼)'
