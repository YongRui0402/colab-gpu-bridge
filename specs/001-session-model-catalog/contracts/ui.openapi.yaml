openapi: 3.1.0
info:
  title: 後端 UI API(工作階段、模型目錄、下載佇列、用量與設定)
  version: 0.1.0
  description: >-
    S5(E2 後端 UI API)依 spec.md、research.md 與 plan.md 產出;狀態推送事件另見 `ui-events.asyncapi.yaml`。

    呼叫者:本系統前端 UI(瀏覽器),家中區網(含 VPN 連回)的任何裝置都能呼叫,不需要登入(NFR-009);
    不對外網公開由部署(S11)的 port 綁定處理,本介面不另驗證呼叫者。UI API 與 Ollama 相容端點(S6)是兩個不同的 port,
    實際號碼由 S11 決定;UI 的靜態檔與本 API 同一個來源,所以 `servers` 只寫相對路徑 `/api`。

    機密(NFR-010):任何回應與事件都不含 Colab 帳號憑證、OAuth token、`code_verifier`、SSH 金鑰,
    也不含執行環境的遠端位址(`colab sessions` 列出的 endpoint)或本機轉發的 port;
    也不提供 Ollama 相容端點的位址(Q49:UI 不顯示它,區網程式的設定方式寫在說明文件,port 由 S11 決定)。

    錯誤本文一律是 `Error`(`{code, message}`,`message` 是給使用者看的繁體中文)。外部依賴的失敗原因沿用轉接層代碼
    (S1 的 `OLLAMA_`、S2 的 `LIBRARY_`、S3 的 `OAUTH_`;`COLAB_`、`TUNNEL_` 由 S8、S9 定),直接放在 `code`,不另造同義的代碼。
    非同步發生的失敗(開啟失敗、失聯、下載失敗、預先載入失敗、讀不到用量)不以 HTTP 錯誤回報,
    而是寫在資源的 `reasonCode` 欄位(同樣是轉接層代碼)並以事件推送。

    長時間操作(開啟、結束、變更類型、下載、預先載入)都是「受理後立即回 202」,進度與結果看資源狀態與 SSE 事件。

    逾時:對遠端 Ollama 照 S1(version 5 秒、tags/ps 10 秒、pull 連線 10 秒且兩行進度之間 60 秒不設總時長、預先載入 300 秒);
    對 ollama.com 與 registry 的每一個請求 10 秒(連線加讀取,本步驟決定,見各操作的 `x-timeout`)。
servers:
  - url: /api
    description: 與 UI 靜態檔同一個來源;port 由 S11 決定
paths:
  /auth:
    get:
      operationId: getAuthStatus
      summary: 查 Colab 帳號是否已登入
      description: >-
        UI 顯示「已登入」或「登入 Colab」按鈕用(FR-008)。後端以 Colab CLI 能否回應判斷(research.md R2;實際指令與失敗分類屬 S8)。
        讀不到時 `state` 為 `unknown`,`reasonCode` 帶 S8 定的 `COLAB_` 代碼;授權過期時為 `logged_out`(spec 邊界情況「需要重新登入」),
        不當成工作階段失聯。
      x-requirements: [FR-008, NFR-009, NFR-010]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '200':
          description: 目前的登入狀態
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
  /auth/authorizations:
    post:
      operationId: startAuthorization
      summary: 取得 Google 授權連結
      description: >-
        產生一次新的授權流程(S3 `authorize`:新的 `state`、PKCE `code_verifier` 與 `code_challenge`),回傳授權網址與流程代號
        (使用者故事 1 驗收情境 9)。`code_verifier` 只留在後端記憶體、不寫入任何檔案(Q17),
        所以後端重新啟動後舊的流程代號就失效,要重新取得授權連結。同一時間只有最新的一次流程有效:
        再呼叫一次會讓前一次的流程代號失效。已登入時也可以呼叫(重新登入)。
        使用者在 Google 頁面按「取消」或授權請求被拒(S3 `OAUTH_AUTHORIZE_REJECTED`)時,後端收不到任何東西,
        使用者拿不到授權碼,UI 讓使用者再取得一次授權連結即可。
      x-requirements: [FR-008, NFR-010]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '201':
          description: 新的授權流程;網址交給 UI 顯示成連結,在使用者自己的瀏覽器開啟
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationFlow'
  /auth/authorizations/{flowId}/code:
    post:
      operationId: submitAuthorizationCode
      summary: 送出使用者貼回的授權碼
      description: >-
        後端以授權碼與同一次流程的 `code_verifier` 向 Google 換 token(S3 `requestToken`,`grant_type=authorization_code`),
        成功就保存成 Colab CLI 讀得到的授權檔(位置與權限屬 S8、S10),回傳已登入的狀態並推送 `auth.updated`。
        授權碼送出前去掉前後空白。換 token 失敗時流程代號仍然有效,使用者可以用同一個連結再取得一次授權碼重送,
        也可以重新取得授權連結(使用者故事 1 驗收情境 10)。成功後這個流程代號失效。
        Google 的失敗依 S3 的轉接層代碼原樣放在 `code`。
      x-requirements: [FR-008, NFR-010]
      x-callers: UI(家中區網的任何瀏覽器,不需登入),持有最新一次 `startAuthorization` 的流程代號
      x-timeout: 對 Google token 端點 10 秒,逾時歸 `OAUTH_TIMEOUT`
      parameters:
        - name: flowId
          in: path
          required: true
          description: '`startAuthorization` 回傳的流程代號'
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{16,64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizationCodeInput'
      responses:
        '200':
          description: 登入成功;`state` 為 `logged_in`
          x-recipients: 呼叫者(UI);token 不回傳,UI 只看到是否已登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStatus'
        '400':
          description: >-
            本文不是合法 JSON 或缺少 `code`;授權碼去掉空白後是空的;
            Google 回 `invalid_grant`(授權碼錯誤、已用過、已過期,或與這次流程的 `code_verifier` 不符);
            使用者在同意畫面取消勾選 colaboratory 權限
          x-error-codes: [INVALID_REQUEST_BODY, INVALID_AUTH_CODE, OAUTH_INVALID_GRANT, OAUTH_SCOPE_NOT_GRANTED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: >-
            授權連結已失效(Q46):後端沒有這個流程代號對應的進行中登入流程,例如後端重新啟動後 `code_verifier` 已遺失(Q17)、
            已被較新的一次授權流程取代,或已經成功使用過;UI 提示使用者重新取得授權連結。
            和授權碼本身錯誤(Google 回 `invalid_grant`,400 `OAUTH_INVALID_GRANT`)是不同的原因、不同的代碼
          x-error-codes: [AUTH_LINK_EXPIRED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            連不到 Google、Google 端錯誤、回應格式不對或缺 refresh token,或 Google 拒絕本系統的 client 設定
            (這幾種不是使用者能修正的,照 S3 代碼回報)
          x-error-codes: [OAUTH_UNREACHABLE, OAUTH_SERVER_ERROR, OAUTH_BAD_RESPONSE, OAUTH_INVALID_REQUEST, OAUTH_INVALID_CLIENT, OAUTH_UNAUTHORIZED_CLIENT, OAUTH_UNSUPPORTED_GRANT_TYPE, OAUTH_INVALID_SCOPE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Google token 端點在逾時內沒有回應
          x-error-codes: [OAUTH_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session:
    get:
      operationId: getSession
      summary: 查目前的工作階段
      description: >-
        回傳目前(或最近一次)的工作階段:狀態、類型、開啟進行到哪一步、結束原因、閒置倒數、重連期限與警告(FR-003、FR-009、NFR-001)。
        從來沒開過時 `state` 為 `none`(未開啟)。後端重新啟動後,這裡反映的是重新接上之後的真實狀態(FR-005、使用者故事 1 驗收情境 7)。
        狀態有變化時另以 `session.updated` 事件推送。
      x-requirements: [FR-003, FR-004, FR-005, FR-007, FR-009, FR-025, FR-026, NFR-009, NFR-010]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      responses:
        '200':
          description: 工作階段的現況
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
    post:
      operationId: openSession
      summary: 開啟工作階段
      description: >-
        依選定的類型在 Colab 開啟執行環境、啟動 Ollama 並建立通道(FR-001),受理後立即回 202,`state` 為 `opening`,
        之後以 `session.updated` 推送每一步(`step`)與結果。開啟失敗時狀態為 `open_failed`、`endReason` 為 `OPEN_FAILED`,
        `reasonCode` 帶 S8、S9 或 S1 的轉接層代碼,並確認沒有遺留的執行環境;釋放不了時 `releaseWarning` 不為空(FR-007)。
        餘額低於警告門檻不阻止開啟(FR-025)。下載佇列裡排隊中的項目在就緒後自動開始。
        開啟流程的總時限 5 分鐘(Q58、SC-001):從受理起超過 5 分鐘還沒就緒,即判定 `open_failed`、`reasonCode` 為 `COLAB_TIMEOUT`,並釋放執行環境。
        遺留處理照 Q63:`colab new` 不中途終止,等它結束後再 stop 並以 `colab sessions` 確認;`colab new` 因逾時被終止時,
        比對開啟前後 Colab 帳號下沒有名稱的執行環境清單,多出來的視為可能的遺留,`releaseWarning` 不為空(FR-007)。
      x-requirements: [FR-001, FR-006, FR-007, FR-008, FR-009, FR-025, NFR-001]
      x-callers: UI;目前沒有開啟中、就緒、重連中或結束中的工作階段,且 Colab 帳號不是「未登入」
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionInput'
      responses:
        '202':
          description: 已受理,開始開啟;回傳 `state` 為 `opening` 的工作階段
          x-recipients: 呼叫者(UI);同一份狀態也以 `session.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 本文不是合法 JSON;`runtimeType` 的 GPU 不在可選清單,或 `highMem` 不是布林值
          x-error-codes: [INVALID_REQUEST_BODY, INVALID_RUNTIME_TYPE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            已有開啟中、就緒或重連中的工作階段(FR-006,使用者故事 1 驗收情境 8);目前的工作階段正在結束;
            沒有有效的 Colab 帳號授權,要先登入(FR-008)
          x-error-codes: [SESSION_ALREADY_ACTIVE, SESSION_ENDING, AUTH_REQUIRED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: endSession
      summary: 結束工作階段
      description: >-
        結束目前的工作階段並釋放執行環境(FR-002;結束前的確認步驟在 UI)。受理後立即回 202,`state` 為 `ending`,
        確認 Colab 帳號下已沒有這個執行環境後變成 `ended`、`endReason` 為 `USER_ENDED`(FR-007、SC-003)。
        開啟到一半呼叫時,停止開啟流程並釋放已配置的執行環境,結果同樣是 `ended`(spec 邊界情況)。
        正在下載的項目中斷,變成 `failed`(`reasonCode` 為 `SESSION_ENDED`);排隊中的保留(使用者故事 3 驗收情境 7)。
        工作階段已是 `open_failed` 或 `lost` 但 `releaseWarning` 不為空時,呼叫這個操作會再試一次釋放。
        已經是 `ending` 時再呼叫一次不另做事,照樣回 202。
        對 Ollama 相容端點(S6,Q25):結束開始之後收到的推論或查詢請求回 `NO_READY_SESSION`;
        串流途中因結束而中斷的那一次,用戶端收到 `NO_READY_SESSION`,只有連線本身中斷(不是本系統結束的)才是 `OLLAMA_STREAM_INTERRUPTED`。
      x-requirements: [FR-002, FR-007, FR-021]
      x-callers: UI;工作階段是開啟中、就緒、重連中、結束中,或已結束但仍有釋放警告
      responses:
        '202':
          description: 已受理,開始結束(或再試一次釋放);回傳 `state` 為 `ending` 的工作階段
          x-recipients: 呼叫者(UI);同一份狀態也以 `session.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          description: 沒有可以結束的工作階段(未開啟,或已結束且沒有釋放警告)
          x-error-codes: [NO_ACTIVE_SESSION]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /session/restart:
    post:
      operationId: restartSession
      summary: 變更執行階段類型並重開
      description: >-
        FR-010:結束目前的執行環境(`endReason` 為 `RUNTIME_TYPE_CHANGED`,寫入紀錄),再以新類型開一個新的工作階段;
        「會結束目前的工作階段並重開」的確認在 UI。受理後立即回 202,回傳新的工作階段,`state` 為 `opening`、`step` 為 `ending_previous`。
        呼叫當下已載入的模型(`/api/ps`)會加進下載佇列(`origin` 為 `restore`、`preloadOnComplete` 為 true),
        新的工作階段就緒後依序重新下載並預先載入(使用者故事 1 驗收情境 12)。
        新類型開不起來時新的工作階段為 `open_failed`,原本的執行環境已結束、不留遺留(使用者故事 1 驗收情境 13);
        要重新下載的項目留在佇列裡排隊。重開期間 Ollama 相容端點對推論或查詢請求回 `NO_READY_SESSION`(spec 邊界情況);
        串流途中因換類型而中斷的那一次同樣是 `NO_READY_SESSION`,連線本身中斷才是 `OLLAMA_STREAM_INTERRUPTED`(Q25,與 `endSession` 相同)。
      x-requirements: [FR-009, FR-010, FR-007, FR-021, NFR-001]
      x-callers: UI;目前有開啟中、就緒或重連中的工作階段
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenSessionInput'
      responses:
        '202':
          description: 已受理;回傳新的工作階段,`state` 為 `opening`
          x-recipients: 呼叫者(UI);同一份狀態也以 `session.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: 本文不是合法 JSON;`runtimeType` 的 GPU 不在可選清單,或 `highMem` 不是布林值
          x-error-codes: [INVALID_REQUEST_BODY, INVALID_RUNTIME_TYPE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            沒有開啟中、就緒或重連中的工作階段(這時直接用 `openSession` 選類型開啟);目前的工作階段正在結束;
            沒有有效的 Colab 帳號授權
          x-error-codes: [NO_ACTIVE_SESSION, SESSION_ENDING, AUTH_REQUIRED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sessions:
    get:
      operationId: listSessionHistory
      summary: 列出最近的工作階段紀錄
      description: >-
        使用者故事 1 驗收情境 14、FR-028:依開啟時間由新到舊,每筆有開啟與結束時間、類型、結束狀態與原因、運行時長。
        還沒結束的那一筆也列出(`endedAt` 為 null)。要看某一筆的每次狀態變化用 `getSessionRecord`。
        分頁:帶上一頁最後一筆的 `openedAt` 當 `before` 取下一頁。
      x-requirements: [FR-028]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      parameters:
        - name: limit
          in: query
          required: false
          description: 一頁的筆數,1 到 100,預設 20
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: before
          in: query
          required: false
          description: 只列開啟時間早於這個時間的紀錄(ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 這一頁的紀錄;`hasMore` 表示還有更早的
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryPage'
        '400':
          description: '`limit` 不是 1 到 100 的整數;`before` 不是 ISO 8601 時間'
          x-error-codes: [INVALID_LIMIT, INVALID_BEFORE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /sessions/{name}:
    get:
      operationId: getSessionRecord
      summary: 查一筆工作階段紀錄與它的每次狀態變化
      x-requirements: [FR-028]
      x-callers: UI(家中區網的任何瀏覽器,不需登入)
      parameters:
        - name: name
          in: path
          required: true
          description: 工作階段的識別名稱
          schema:
            type: string
            pattern: '^cgb-[a-z0-9-]{1,60}$'
      responses:
        '200':
          description: 這筆紀錄與依時間排序的狀態變化
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRecordDetail'
        '404':
          description: 沒有這個名稱的紀錄
          x-error-codes: [SESSION_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /models:
    get:
      operationId: listCatalog
      summary: 列出執行環境上已下載的模型(模型目錄)
      description: >-
        FR-014:名稱、大小、是否已載入;來自遠端 Ollama 的 `listLocalModels` 與 `listLoadedModels`(S1),
        只含下載完成的模型(FR-018,依 Q2 信任 `/api/tags`)。執行環境剛開好時是空的。
        NFR-006:`vramBytes` 是目前執行環境 GPU 的顯示記憶體總量(由 S8 經 `colab exec` 取得,Q7、Q62;不扣掉已載入模型佔用的部分),
        模型大小超過它時 `mayNotFit` 為 true;讀不到時 `vramBytes` 與 `mayNotFit` 為 null。
        目錄有變化(下載完成、預先載入開始或結束)時另以 `models.updated` 事件推送。
      x-requirements: [FR-014, FR-018, NFR-006]
      x-callers: UI;工作階段「就緒」
      x-timeout: 遠端 Ollama 的 tags、ps 各 10 秒(S1)
      responses:
        '200':
          description: 模型目錄
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelCatalog'
        '502':
          description: 經通道連不到遠端 Ollama,或回應格式不對
          x-error-codes: [OLLAMA_UNREACHABLE, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
