openapi: 3.1.0
info:
  title: Google OAuth 2.0(Colab CLI 的授權碼流程)
  version: 0.1.0
  description: >-
    S3(E9 Google OAuth)依 spec.md 與 plan.md 產出。描述 Google 定好的 OAuth 2.0 介面原樣,只寫本系統會用到的三個操作:
    組出授權網址讓使用者在瀏覽器登入(`authorize`)、以使用者貼回的授權碼換 token 與以 refresh token 更新 access token(兩者同為 `requestToken`,依 `grant_type` 區分)。
    流程照 research.md R2:與 google-colab-cli 0.7.5 相同的「複製貼上」授權碼流程(InstalledAppFlow),
    使用 CLI 內建的 OAuth client 設定(installed 型 client;`client_id` 與 `client_secret` 取自 CLI 隨附的 client 設定檔,
    規格檔以 `${COLAB_OAUTH_CLIENT_ID}`、`${COLAB_OAUTH_CLIENT_SECRET}` 代表,不寫真值),
    `redirect_uri` 固定為 `https://sdk.cloud.google.com/applicationdefaultauthcode.html`(Google 登記給這個 client 的落地頁,
    會把授權碼顯示給使用者複製;換成別的 client 會得到 `redirect_uri_mismatch`)。
    授權網址帶 PKCE(`code_challenge_method=S256`),換 token 時要送出同一個 `code_verifier`,
    所以「取得授權網址」與「送出授權碼」之間,後端要保留同一次流程的 `code_verifier`;中途遺失(例如後端重新啟動)時,
    貼回的授權碼換不到 token,Google 回 `invalid_grant`,使用者要重新取得授權網址。
    轉接層把對方的失敗歸成 `OAUTH_` 前綴的原因代碼:HTTP 回應層級的寫在各回應的 `x-error-codes`,
    連不到與逾時這類沒有 HTTP 回應的寫在操作的 `x-transport-error-codes`;這些代碼是本系統的分類,不是 Google 回應的欄位。
    Google 回應錯誤的實際格式是 `OAuthError`(`error`、`error_description`)。
servers:
  - url: https://oauth2.googleapis.com
    description: token 端點(CLI client 設定檔的 `token_uri`)
paths:
  /o/oauth2/auth:
    servers:
      - url: https://accounts.google.com
        description: 授權端點(CLI client 設定檔的 `auth_uri`)
    get:
      operationId: authorize
      summary: 使用者在瀏覽器登入並同意授權
      description: >-
        後端不直接呼叫這個端點,只組出帶下列 query 的完整網址交給 UI 顯示成授權連結(FR-008、使用者故事 1 驗收情境 9);
        使用者在自己的瀏覽器打開、登入 Google 並同意後,Google 把瀏覽器導向 `redirect_uri` 的落地頁,
        落地頁顯示授權碼,使用者把它複製貼回本系統的 UI。授權網址每次都重新產生(新的 `state` 與 `code_challenge`)。
      x-requirements: [FR-008]
      x-callers: 使用者的瀏覽器(網址由後端組出;後端本身不發出這個請求)
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          description: '`${COLAB_OAUTH_CLIENT_ID}`,取自 CLI 隨附的 client 設定檔'
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            enum: ['https://sdk.cloud.google.com/applicationdefaultauthcode.html']
        - name: scope
          in: query
          required: true
          description: >-
            以空白分隔的 scope 清單,與 CLI 0.7.5 相同:`openid`、
            `https://www.googleapis.com/auth/userinfo.profile`、`https://www.googleapis.com/auth/userinfo.email`、
            `https://www.googleapis.com/auth/cloud-platform`、`https://www.googleapis.com/auth/colaboratory`、
            `https://www.googleapis.com/auth/drive.file`
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: 每次產生的隨機字串;落地頁只顯示授權碼,使用者不會貼回 state,所以本系統無法比對它
          schema:
            type: string
        - name: access_type
          in: query
          required: true
          description: '`offline` 才會在換 token 時拿到 refresh token'
          schema:
            type: string
            enum: [offline]
        - name: prompt
          in: query
          required: true
          description: '`consent` 強制顯示同意畫面,確保每次都發新的 refresh token'
          schema:
            type: string
            enum: [consent]
        - name: token_usage
          in: query
          required: true
          description: '`remote`,與 `gcloud auth application-default login` 相同的遠端複製貼上同意參數'
          schema:
            type: string
            enum: [remote]
        - name: code_challenge
          in: query
          required: true
          description: PKCE:`code_verifier`(43–128 字元)的 SHA-256 再做 base64url、去掉尾端 `=`
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{43}$'
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
      responses:
        '302':
          description: >-
            使用者同意後,Google 把瀏覽器導向 `redirect_uri`,query 帶 `code`(授權碼)、`state` 與 `scope`;
            落地頁把 `code` 顯示給使用者複製。使用者按「取消」時,導向同一個落地頁但 query 帶 `error=access_denied`,
            使用者拿不到授權碼,後端也收不到任何東西(UI 要讓使用者能重新取得授權連結)。
          x-recipients: 使用者的瀏覽器(後端收不到這個回應,只會收到使用者貼回的授權碼)
          headers:
            Location:
              description: '`https://sdk.cloud.google.com/applicationdefaultauthcode.html?code=…&state=…&scope=…`'
              schema:
                type: string
                format: uri
        '400':
          description: >-
            授權請求本身被拒(例如 `redirect_uri_mismatch`、`invalid_scope`、`invalid_client`),Google 在瀏覽器顯示錯誤頁;
            後端收不到這個回應,只能從使用者沒有授權碼可貼回得知。正常照本規格組網址時不會發生。
          x-error-codes: [OAUTH_AUTHORIZE_REJECTED]
          content:
            text/html:
              schema:
                type: string
  /token:
    post:
      operationId: requestToken
      summary: 以授權碼換 token,或以 refresh token 更新 access token
      description: >-
        同一個端點依 `grant_type` 分兩種用法。

        `authorization_code`(`AuthorizationCodeGrant`):後端收到使用者在 UI 貼回的授權碼後呼叫(FR-008、使用者故事 1 驗收情境 9、10)。授權碼只能用一次且很快過期;
        錯誤、已用過、已過期,或 `code_verifier` 和授權網址那一次對不上,Google 都回 `invalid_grant`,
        轉接層歸成 `OAUTH_INVALID_GRANT`,UI 顯示登入失敗並讓使用者重新取得授權連結。
        成功後把 token 存成 Colab CLI 讀得到的授權檔(與 CLI 自己登入時寫出的格式相同;位置與權限屬 E5、E10 的分析)。

        `refresh_token`(`RefreshTokenGrant`):依 research.md R2,access token 過期時由 Colab CLI 自己用保存的 refresh token 更新,
        本系統後端不直接送這種請求;寫在這裡是因為更新失敗(`invalid_grant`:refresh token 被撤銷或過期)就是 spec 邊界情況
        「Colab 帳號授權過期」的來源,要回到 FR-008 的登入流程。後端只會從 Colab CLI 的失敗(E5)間接看到它。
        更新成功的回應通常不含新的 `refresh_token`,沿用原本的那一顆。
      x-requirements: [FR-008]
      x-callers: >-
        `authorization_code`:本系統後端(轉接層),在使用者送出授權碼時呼叫一次;
        `refresh_token`:Colab CLI(在本系統容器內執行,讀取後端保存的授權檔),本系統後端不直接呼叫
      x-transport-error-codes:
        OAUTH_UNREACHABLE: 連不到 oauth2.googleapis.com(DNS、連線被拒、TLS 失敗)
        OAUTH_TIMEOUT: 送出後在轉接層的逾時內沒有收到回應
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AuthorizationCodeGrant'
                - $ref: '#/components/schemas/RefreshTokenGrant'
              discriminator:
                propertyName: grant_type
                mapping:
                  authorization_code: '#/components/schemas/AuthorizationCodeGrant'
                  refresh_token: '#/components/schemas/RefreshTokenGrant'
      responses:
        '200':
          description: >-
            換到的 token。換授權碼時,`refresh_token` 在這次流程(`access_type=offline`、`prompt=consent`)會出現;
            沒有出現、`scope` 不含 `https://www.googleapis.com/auth/colaboratory`(使用者在同意畫面取消勾選),
            或內容無法解析時,轉接層不保存,分別歸成 `OAUTH_BAD_RESPONSE`(缺 refresh token 或解析失敗)與 `OAUTH_SCOPE_NOT_GRANTED`。
          x-recipients: >-
            `authorization_code`:本系統後端(token 不回傳給 UI;UI 只看到是否已登入);
            `refresh_token`:Colab CLI(更新後寫回同一份授權檔)
          x-adapter-error-codes: [OAUTH_BAD_RESPONSE, OAUTH_SCOPE_NOT_GRANTED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: >-
            Google 拒絕這次請求。`error` 為 `invalid_grant`(授權碼錯誤、已用過、已過期或 `code_verifier` 不符;
            或 refresh token 被撤銷、過期)、
            `invalid_request`(缺參數或參數重複)、`unsupported_grant_type`、`unauthorized_client`、`invalid_scope`,
            依 `error` 各自歸成一個原因代碼。
          x-error-codes: [OAUTH_INVALID_GRANT, OAUTH_INVALID_REQUEST, OAUTH_UNSUPPORTED_GRANT_TYPE, OAUTH_UNAUTHORIZED_CLIENT, OAUTH_INVALID_SCOPE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: '`error` 為 `invalid_client`:client 設定不對(`client_id` 或 `client_secret` 錯誤,或 CLI 隨附的 client 被停用)'
          x-error-codes: [OAUTH_INVALID_CLIENT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '5XX':
          description: Google 端暫時性錯誤
          x-error-codes: [OAUTH_SERVER_ERROR]
        default:
          description: 其他未預期的狀態碼,或錯誤本文不是 `OAuthError` 的格式
          x-error-codes: [OAUTH_BAD_RESPONSE]
components:
  schemas:
    AuthorizationCodeGrant:
      type: object
      required: [grant_type, code, client_id, client_secret, redirect_uri, code_verifier]
      properties:
        grant_type:
          type: string
          enum: [authorization_code]
        code:
          type: string
          description: 使用者從落地頁複製、貼回 UI 的授權碼;轉接層送出前去掉前後空白
        client_id:
          type: string
          description: '`${COLAB_OAUTH_CLIENT_ID}`,取自 CLI 隨附的 client 設定檔'
        client_secret:
          type: string
          description: '`${COLAB_OAUTH_CLIENT_SECRET}`,取自 CLI 隨附的 client 設定檔;installed 型 client 的 secret,不寫進任何 repo 或紀錄'
        redirect_uri:
          type: string
          enum: ['https://sdk.cloud.google.com/applicationdefaultauthcode.html']
          description: 要和授權網址的 `redirect_uri` 完全相同
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: 產生授權網址那一次的 PKCE `code_verifier`
    RefreshTokenGrant:
      type: object
      required: [grant_type, refresh_token, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [refresh_token]
        refresh_token:
          type: string
        client_id:
          type: string
          description: '`${COLAB_OAUTH_CLIENT_ID}`'
        client_secret:
          type: string
          description: '`${COLAB_OAUTH_CLIENT_SECRET}`'
    TokenResponse:
      type: object
      required: [access_token, expires_in, token_type]
      description: Google 回應可能另帶其他欄位,轉接層忽略不認得的欄位
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          minimum: 0
          description: access token 剩餘有效秒數
        refresh_token:
          type: string
          description: 換授權碼時出現;更新時通常不出現
        scope:
          type: string
          description: 以空白分隔、實際被授予的 scope;可能少於請求的清單
        token_type:
          type: string
          enum: [Bearer]
        id_token:
          type: string
          description: 因為請求了 `openid` 而出現的 JWT
    OAuthError:
      type: object
      required: [error]
      description: Google token 端點的錯誤本文(RFC 6749 §5.2)
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, invalid_grant, unauthorized_client, unsupported_grant_type, invalid_scope]
        error_description:
          type: string
          description: 給人讀的英文說明,內容會改版,轉接層只看 `error` 判斷原因
    Error:
      type: object
      description: >-
        本系統轉接層對 Google 失敗歸類的原因代碼目錄,不是 Google 回應的格式(Google 的格式見 `OAuthError`);
        供 S5 後端 UI API 對應成給 UI 的錯誤。
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - OAUTH_UNREACHABLE
            - OAUTH_TIMEOUT
            - OAUTH_BAD_RESPONSE
            - OAUTH_AUTHORIZE_REJECTED
            - OAUTH_INVALID_GRANT
            - OAUTH_INVALID_REQUEST
            - OAUTH_INVALID_CLIENT
            - OAUTH_UNAUTHORIZED_CLIENT
            - OAUTH_UNSUPPORTED_GRANT_TYPE
            - OAUTH_INVALID_SCOPE
            - OAUTH_SCOPE_NOT_GRANTED
            - OAUTH_SERVER_ERROR
        message:
          type: string
