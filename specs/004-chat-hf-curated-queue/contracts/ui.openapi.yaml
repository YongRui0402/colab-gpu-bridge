          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadEstimate'
        '400':
          description: 本文不是合法 JSON;`models` 是空的;某個模型名稱格式不對(`Error.model` 指出是哪一個)
          x-error-codes: [INVALID_REQUEST_BODY, EMPTY_MODEL_LIST, INVALID_MODEL_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 官方模型庫沒有某個模型或版本(照 002 S1;`Error.model` 指出是哪一個)
          x-error-codes: [LIBRARY_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 某個模型已經在執行環境上;某個模型已經在佇列裡(排隊中或下載中)。比對不分大小寫,`Error.model` 是這次請求裡那一個補過版本的名稱
          x-error-codes: [MODEL_ALREADY_DOWNLOADED, DOWNLOAD_ALREADY_QUEUED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            某個模型不能下載,`Error.model` 指出是哪一個:官方的版本只能在 Ollama 雲端執行(`LIBRARY_CLOUD_ONLY`);
            hf.co 模型需要登入、同意條款、私有或不存在(`HF_AUTH_REQUIRED`);hf.co 的量化版本無法下載(不存在、分割檔或不是 GGUF,`HF_QUANT_UNAVAILABLE`)
          x-error-codes: [LIBRARY_CLOUD_ONLY, HF_AUTH_REQUIRED, HF_QUANT_UNAVAILABLE]
          content:
            application/json:
