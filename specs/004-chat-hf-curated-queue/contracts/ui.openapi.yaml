                $ref: '#/components/schemas/Error'
        '502':
          description: 同 `enqueueDownloads` 的 502
          x-error-codes: [LIBRARY_UNREACHABLE, LIBRARY_SERVER_ERROR, LIBRARY_BAD_RESPONSE, HF_UNREACHABLE, HF_SERVER_ERROR, HF_BAD_RESPONSE, OLLAMA_UNREACHABLE, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 沒有就緒的工作階段(含開啟中、重連中);讀不到執行環境的剩餘磁碟空間(`Error.reasonCode` 帶 001 S8 的代碼)
          x-error-codes: [NO_READY_SESSION, DISK_SPACE_UNKNOWN]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 同 `enqueueDownloads` 的 504
          x-error-codes: [LIBRARY_TIMEOUT, HF_TIMEOUT, OLLAMA_TIMEOUT]
          content:
            application/json:
