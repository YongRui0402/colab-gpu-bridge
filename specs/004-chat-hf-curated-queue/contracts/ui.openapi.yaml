      description: >-
        沿用 001~003:按「加入下載」後、確認前呼叫,不改變佇列;檢查條件與 `enqueueDownloads` 相同(`info.x-download-check-order`),
        只差空間不足時不回錯誤、改以 `fits` 表示。預估時間是總大小 ÷ 50 MB/s,UI 標示為估計值。

        這一輪:hf.co 名稱的大小取自 Hugging Face 的 manifest(`layers[].size` 的總和,和展開版本的 `sizeBytes` 同一個算法,
        所以試算顯示的大小等於展開時列出的大小,使用者故事 4 獨立測試);和官方模型的總大小、剩餘磁碟、預估時間一起算(FR-014、驗收情境 3)。
        需要登入或量化版本無法下載的 hf.co 名稱在這裡就擋下並說明原因(FR-015)。比對不分大小寫(FR-018)。`HF_*` 的狀態碼照 `info.x-hf-error-status`。
      x-requirements: [FR-014, FR-015, FR-016, FR-018, NFR-005, NFR-006, SC-006]
