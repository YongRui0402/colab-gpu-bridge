  /downloads/{id}/retry:
    post:
      operationId: retryDownload
      summary: 重新下載一筆失敗的項目
      description: >-
        沿用 001:失敗的項目重新排到佇列最後,狀態回到排隊中;先確認模型不在執行環境上。
        剩餘磁碟的檢查(001 合約的 `DISK_SPACE_INSUFFICIENT`、`DISK_SPACE_UNKNOWN`)001 起就沒有實作(001 plan.md Q178),
        這一輪照舊不讀剩餘磁碟、不回這兩個代碼(Q56、D70:`DISK_SPACE_*` 照舊範圍外),留給處理 001 Q178 的迭代。
        這一輪:「模型已經在執行環境上」的比對照 `info.x-model-name-rule` 不分大小寫(FR-018);
        失敗的項目只會是目前工作階段的(`info.x-queue-clearing`),所以不再有「工作階段結束而中斷」的失敗項目可以重試。
      x-requirements: [FR-018, NFR-006]
      x-callers: UI;工作階段「就緒」,項目是失敗
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 重新排隊的那一筆
          x-recipients: 呼叫者(UI);也以 `download.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJob'
        '404':
          description: 佇列沒有這一筆
          x-error-codes: [DOWNLOAD_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 這一筆不是失敗(排隊中、下載中或已完成);模型已經在執行環境上(不分大小寫)
          x-error-codes: [DOWNLOAD_NOT_RETRYABLE, MODEL_ALREADY_DOWNLOADED]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 確認執行環境上已有的模型時連不到遠端 Ollama 或回應格式不對
          x-error-codes: [OLLAMA_UNREACHABLE, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 沒有就緒的工作階段
          x-error-codes: [NO_READY_SESSION]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 遠端 Ollama 在逾時內沒有回應
          x-error-codes: [OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads/auto-result:
    get:
      operationId: getAutoDownloadResult
      summary: 讀目前工作階段的自動下載結果(模型頁下載佇列上方的提示區)
      description: >-
        FR-012、使用者故事 3 驗收情境 6、7、9、10:回目前工作階段的自動下載結果(判定方式見 `info.x-auto-download`)。
        就緒之後才打開或重新整理模型頁也讀得到(提示區在模型頁的下載佇列上方,Q29、D43),直到工作階段結束或使用者按關閉(`dismissed` 為 true 時前端不顯示提示區)。
        `result` 為 null 的情況:沒有工作階段或還沒第一次就緒、精選清單沒有任何一項設 `autoDownload`、工作階段已結束(結果已清除)。
        變化另以 `autoDownload.updated` 推送(`ui-events.asyncapi.yaml`)。
      x-requirements: [FR-011, FR-012, SC-003]
      x-callers: UI(家中區網的任何瀏覽器,不需登入);不需要工作階段(沒有時 `result` 為 null)
      responses:
        '200':
          description: 目前工作階段的自動下載結果,或 null
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoDownloadNotice'
  /downloads/auto-result/dismiss:
    post:
      operationId: dismissAutoDownloadResult
      summary: 關閉自動下載的提示
      description: >-
        FR-012:使用者按提示區的「關閉」。把目前工作階段的結果標成 `dismissed`,之後重新整理也不再顯示;不影響已排入的下載。
        已經關閉過時照樣回 200(不另做事)。`state` 為 `running` 時也可以關閉,判定完成後 `dismissed` 仍為 true。
        成功後推送 `autoDownload.updated`。
      x-requirements: [FR-012, NFR-006]
      x-callers: UI;目前的工作階段有自動下載結果
      responses:
        '200':
          description: 關閉後的結果(`dismissed` 為 true)
          x-recipients: 呼叫者(UI);同一份也以 `autoDownload.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoDownloadResult'
        '404':
          description: 目前的工作階段沒有自動下載結果(沒有工作階段、還沒第一次就緒、沒有任何一項設 `autoDownload`,或工作階段已結束)
          x-error-codes: [AUTO_DOWNLOAD_RESULT_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ReasonCode:
      type: string
      pattern: '^((COLAB|TUNNEL|OLLAMA|LIBRARY|OAUTH|HF)_[A-Z0-9_]+|AUTH_REQUIRED)$'
      description: >-
        外部依賴失敗的轉接層代碼,照原文沿用:`OLLAMA_`(S1)、`LIBRARY_`(002 S1)、`HF_`(S2,這一輪新增)、`OAUTH_`、`COLAB_`、`TUNNEL_`(001);
        各前綴底下的代碼以各步驟的規格檔為準。另外允許 `AUTH_REQUIRED`(001 S8 偵測到 Colab CLI 的授權失效)
    ModelName:
      type: string
      pattern: '^([a-z0-9][a-z0-9._-]*|hf\.co/[A-Za-z0-9][A-Za-z0-9._-]*/[A-Za-z0-9][A-Za-z0-9._-]*)(:[A-Za-z0-9_][A-Za-z0-9._-]*)?$'
      description: >-
        官方模型名稱(可帶 `:版本`,例 qwen2.5:7b),或 Hugging Face 的 `hf.co/<作者>/<模型>[:<量化版本>]`
        (例 hf.co/bartowski/SmolLM2-135M-Instruct-GGUF:Q4_K_M;FR-018,research.md R4)。沒寫版本視為 `latest`,比對不分大小寫(`info.x-model-name-rule`)。
        前綴只接受小寫的 `hf.co/`,`huggingface.co/` 不接受(Ollama 當成另一個名稱);作者與模型的大小寫照原樣。
        官方名稱照 001 只接受小寫,也仍然不接受社群模型的 `<使用者>/<名稱>`(001 Q9)
    GpuType:
      type: string
      enum: [T4, L4, G4, A100, H100]
      description: 照 001 原樣;H100 只在 UI 選單隱藏(FR-017),後端照常接受與顯示
    RuntimeType:
      type: object
      required: [gpu, highMem]
      properties:
        gpu:
          $ref: '#/components/schemas/GpuType'
        highMem:
          type: boolean
          description: 是否高 RAM(照 001)
    ChatInput:
      type: object
      required: [model, messages]
      description: 對話頁送出的本文;其他欄位不轉送(spec.md 假設:不做 system prompt 與 temperature 等參數)
      properties:
        model:
          $ref: '#/components/schemas/ModelName'
          description: 對話頁選的模型,照 `listCatalog` 列出的 `name` 原樣
        messages:
          type: array
          minItems: 1
          description: 這段對話依序的每一則,最後一則是這次送出的訊息;清空或換模型後從頭開始(FR-006,只在瀏覽器上)
          items:
            $ref: '#/components/schemas/ChatInputMessage'
    ChatInputMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
          description: 使用者送出的,或模型先前的回覆
        content:
          type: string
          description: >-
            這一則的文字;先前的回覆照收到的 `message.content` 接起來,不含 `thinking`(Ollama 不需要思考過程也能接續對話)
    ChatStreamLine:
      description: 對話串流的一行:遠端 Ollama 的一段(照原樣),或本系統在失敗時補上的最後一行
      oneOf:
        - $ref: '#/components/schemas/ChatChunk'
        - $ref: '#/components/schemas/ChatStreamFailure'
    ChatChunk:
      type: object
      required: [done]
      additionalProperties: true
      description: >-
        遠端 Ollama `/api/chat` 串流的一行,照原樣轉送(S1 `ChatResponse`);欄位與型別以 S1 為準,這裡只列前端會用到的。
        沒有 `error` 欄位(帶 `error` 的行不轉送,改成 `ChatStreamFailure`)
      properties:
        model:
          type: string
        created_at:
          type: string
          format: date-time
        message:
          type: object
          properties:
            role:
              type: string
              const: assistant
            content:
              type: string
              description: 這一段回覆的文字,逐段接起來顯示;思考型模型在思考期間可能是空字串
            thinking:
              type: string
              description: 思考型模型的思考過程(出現時才有),前端逐段顯示、可以收合(Q10、D24)
        done:
          type: boolean
          description: true 表示這則回覆完成,是正常結束時的最後一行
        done_reason:
          type: string
          description: >-
            結束的原因,例如 stop、length(只在 `done: true` 那一行)
        eval_count:
          type: integer
          minimum: 0
          description: >-
            這則回覆產生的 token 數(只在 `done: true` 那一行;可能缺少,Q8)
        eval_duration:
          type: integer
          minimum: 0
          description: 產生回覆花的時間,奈秒;缺少或為 0 時前端不顯示每秒 token 數(Q8)
    ChatStreamFailure:
      type: object
      required: [error]
      description: >-
        串流開始之後失敗時,本系統補上的最後一行;送出後串流結束。和遠端 Ollama 的 `{"error": "<英文>"}` 不同,
        `error` 是物件,前端以此分辨
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [OLLAMA_TIMEOUT, OLLAMA_STREAM_INTERRUPTED, OLLAMA_SERVER_ERROR, OLLAMA_BAD_RESPONSE, SESSION_ENDED]
            message:
              type: string
              description: 給使用者看的繁體中文說明(固定訊息表),不帶遠端的英文原文
    HfSearchPage:
      type: object
      required: [query, items, hasMore, nextCursor]
      properties:
        query:
          type: string
          description: 去掉前後空白後的關鍵字
        items:
          type: array
          maxItems: 20
          description: 依下載次數由多到少;沒有符合的模型時是空陣列
          items:
            $ref: '#/components/schemas/HfModel'
        hasMore:
          type: boolean
          description: 還有下一頁,前端顯示「載入更多」;等於 `nextCursor` 不為 null
        nextCursor:
          type: [string, 'null']
          description: 下一頁的 `cursor`,原樣帶回;最後一頁為 null
    HfModel:
      type: object
      required: [id, author, model, name]
      properties:
        id:
          type: string
          description: '`<作者>/<模型>`,照 Hugging Face 原樣'
          example: unsloth/Qwen3-0.6B-GGUF
        author:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: 作者;展開時帶進 `listHfQuants` 的路徑
        model:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
          description: 模型名稱;展開時帶進 `listHfQuants` 的路徑
        name:
          type: string
          description: 'Ollama 用的名稱 `hf.co/<作者>/<模型>`(不含量化版本)'
          example: hf.co/unsloth/Qwen3-0.6B-GGUF
        downloads:
          type: [integer, 'null']
          minimum: 0
          description: Hugging Face 的下載次數,只用來顯示;對方沒給或型別不符時為 null
    HfQuant:
      type: object
      required: [quant, name, sizeBytes, downloaded]
      properties:
        quant:
          type: string
          description: 量化名稱,照檔名第一次出現的寫法(例 Q4_K_M、q4_k_m、F16)
        name:
          type: string
          description: '`hf.co/<作者>/<模型>:<量化名稱>`;勾選後照它試算與加入下載'
          example: hf.co/unsloth/Qwen3-0.6B-GGUF:Q4_K_M
        sizeBytes:
          type: integer
          minimum: 0
          description: manifest `layers[].size` 的總和,位元組;和試算的大小相同
        downloaded:
          type: boolean
          description: 執行環境上已有這個版本(不分大小寫比對);`runtimeChecked` 為 false 時都是 false
    HfQuantList:
      type: object
      required: [author, model, runtimeChecked, quants]
      properties:
        author:
          type: string
        model:
          type: string
        runtimeChecked:
          type: boolean
          description: 有沒有對照執行環境上的模型;沒有就緒的工作階段或讀不到時為 false
        quants:
          type: array
          minItems: 1
          description: 可下載的量化版本,依檔案清單的順序,不分大小寫去重
          items:
            $ref: '#/components/schemas/HfQuant'
    CuratedModelInput:
      type: object
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ModelName'
        description:
          type: [string, 'null']
          maxLength: 200
          description: 使用者寫的說明,可以不填
        recommendedRuntimeType:
          oneOf:
            - $ref: '#/components/schemas/RuntimeType'
            - type: 'null'
          description: 建議的執行階段類型,可以不填;UI 選單不列 H100,後端照常接受(FR-017)
        autoDownload:
          type: boolean
          default: false
          description: 開好就自動下載(FR-010);沒給時為 false
    CuratedModel:
      type: object
      required: [id, name, autoDownload, downloaded]
      properties:
        id:
          type: integer
          minimum: 1
          description: 也代表加入的順序;修改不改變
        name:
          type: string
          description: 模型名稱含版本(沒寫版本時存成 `<名稱>:latest`),大小寫照使用者輸入
        description:
          type: [string, 'null']
        recommendedRuntimeType:
          oneOf:
            - $ref: '#/components/schemas/RuntimeType'
            - type: 'null'
        autoDownload:
          type: boolean
          description: 開好就自動下載;既有的項目升級後為 false(spec.md 假設)
        downloaded:
          type: boolean
          description: 執行環境上已有這個模型(不分大小寫比對)
    CuratedList:
      type: object
      required: [runtimeChecked, items]
      properties:
        runtimeChecked:
          type: boolean
          description: 有沒有對照執行環境上的模型;沒有就緒的工作階段或讀不到時為 false
        items:
          type: array
          description: 依加入的順序
          items:
            $ref: '#/components/schemas/CuratedModel'
    DownloadSelection:
      type: object
      required: [models]
      properties:
        models:
          type: array
          description: 勾選或輸入的模型名稱(官方或 hf.co,可以混在同一批);補過版本後不分大小寫相同的視為同一個,保留第一次出現的順序與寫法
          items:
            $ref: '#/components/schemas/ModelName'
    EstimateItem:
      type: object
      required: [name, sizeBytes]
      properties:
        name:
          type: string
          description: 名稱含版本(沒寫版本時補上 latest),大小寫照使用者第一次的寫法
        sizeBytes:
          type: integer
          minimum: 0
          description: manifest `layers[].size` 的總和,位元組(官方取自 registry,hf.co 取自 Hugging Face)
    DownloadEstimate:
      type: object
      required: [items, totalBytes, pendingQueueBytes, freeDiskBytes, diskCheckedAt, fits, estimatedSeconds]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EstimateItem'
        totalBytes:
          type: integer
          minimum: 0
        pendingQueueBytes:
          type: integer
          minimum: 0
          description: 佇列裡排隊中與下載中的項目還沒下載的大小,位元組
        freeDiskBytes:
          type: integer
          minimum: 0
        diskCheckedAt:
          type: string
          format: date-time
        fits:
          type: boolean
          description: totalBytes 加 pendingQueueBytes 不超過 freeDiskBytes
        estimatedSeconds:
          type: integer
          minimum: 0
          description: 預估下載時間,秒;以 50 MB/s 估算,UI 標示為估計值
    DownloadProgress:
      type: object
      required: [completedBytes, totalBytes]
      properties:
        phase:
          type: string
          enum: [manifest, downloading, verifying, writing]
        completedBytes:
          type: integer
          minimum: 0
        totalBytes:
          type: integer
          minimum: 0
    DownloadJob:
      type: object
      required: [id, model, source, sizeBytes, state, origin, preloadOnComplete, addedAt]
      properties:
        id:
          type: integer
          minimum: 1
        model:
          type: string
          description: 模型名稱含版本,大小寫照加入時的寫法;「已在佇列」的比對用這個欄位(不分大小寫)
        source:
          type: string
          enum: [library, huggingface]
          description: 官方模型庫或 Hugging Face;名稱以 `hf.co/` 開頭的是 `huggingface`(這一輪新增,spec.md 關鍵實體)
        sizeBytes:
          type: integer
          minimum: 0
          description: 加入時 manifest 算出的大小,位元組
        state:
          type: string
          enum: [queued, downloading, completed, failed]
          description: 排隊中、下載中、完成、失敗;只有排隊中與下載中算「已在佇列」
        progress:
          oneOf:
            - $ref: '#/components/schemas/DownloadProgress'
            - type: 'null'
          description: 只在 `downloading` 時有值;事件最多每秒推一次
        reasonCode:
          type: [string, 'null']
          description: >-
            失敗原因:S1 `pullModel` 的 `OLLAMA_` 代碼(`OLLAMA_UNREACHABLE`、`OLLAMA_TIMEOUT`、`OLLAMA_BAD_RESPONSE`、`OLLAMA_BAD_REQUEST`、
            `OLLAMA_SERVER_ERROR`、`OLLAMA_NOT_FOUND`、`OLLAMA_PULL_FAILED`、`OLLAMA_STREAM_INTERRUPTED`),或本系統的 `DISK_SPACE_INSUFFICIENT`。
            這一輪起工作階段結束時下載中的項目直接移除,不再出現 `SESSION_ENDED`(`info.x-queue-clearing`)
        message:
          type: [string, 'null']
          description: 給使用者看的繁體中文失敗說明
        origin:
          type: string
          enum: [user, restore, auto]
          description: >-
            使用者加入的;變更類型時為了重新載入原本的模型而加入的(FR-002);工作階段第一次就緒時依精選清單自動排入的(`auto`,這一輪新增,FR-011)
        preloadOnComplete:
          type: boolean
          description: 下載完成後自動預先載入(只有 `origin` 為 `restore` 時為 true)
        addedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    DownloadJobList:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          description: 這次加入的項目,依合併後的順序
          items:
            $ref: '#/components/schemas/DownloadJob'
    DownloadQueue:
      type: object
      required: [paused, jobs]
      properties:
        paused:
          type: boolean
          description: >-
            沒有就緒的工作階段。重連中時佇列照樣留著這個工作階段的項目;變更類型時只有等新工作階段就緒的重新載入項目;
            其他時候是空的(見 `listDownloads`、`info.x-queue-clearing`)
        jobs:
          type: array
          description: 佇列裡的每一項,依加入順序;不依工作階段過濾,清除是同步的,所以只會有目前(或變更類型後新的)工作階段的項目(Q46)
          items:
            $ref: '#/components/schemas/DownloadJob'
    AutoDownloadSkipped:
      type: object
      required: [model, reason, message]
      properties:
        model:
          type: string
          description: 精選清單裡那一項的名稱(含版本)
        reason:
          type: string
          enum: [DISK_SPACE_INSUFFICIENT, SIZE_UNAVAILABLE, MAY_NOT_FIT, DISK_SPACE_UNKNOWN]
          description: >-
            空間不足;取不到大小(模型來源連不到、逾時、找不到、不能下載);這台可能無法載入(大小超過顯示記憶體總量);
            讀不到執行環境的剩餘磁碟空間(`info.x-auto-download` (3))
        reasonCode:
          oneOf:
            - $ref: '#/components/schemas/ReasonCode'
            - type: 'null'
          description: >-
            `SIZE_UNAVAILABLE` 時是取大小失敗的代碼(`LIBRARY_*` 或 `HF_*`,例如 `HF_AUTH_REQUIRED`、`LIBRARY_NOT_FOUND`);
            `DISK_SPACE_UNKNOWN` 時是 001 S8 的 `COLAB_` 代碼;其他為 null
        message:
          type: string
          description: 給使用者看的繁體中文原因,例如「空間不足」「這台可能無法載入」
        sizeBytes:
          type: [integer, 'null']
          minimum: 0
          description: >-
            這一項的大小(manifest `layers[].size` 的總和),位元組;`SIZE_UNAVAILABLE` 時為 null,其他原因都有值
            (大小在 `info.x-auto-download` (3)(b) 就取得,早於讀剩餘磁碟;Q68、D86)
        freeDiskBytes:
          type: [integer, 'null']
          minimum: 0
          description: >-
            只在 `DISK_SPACE_INSUFFICIENT` 時有值:判定這一項時的剩餘磁碟空間扣掉已決定排入的大小與佇列裡還沒下載完的大小之後剩下的,位元組
            (原型的「排入前面幾個之後只剩 …」);其他原因為 null
        vramBytes:
          type: [integer, 'null']
          minimum: 0
          description: 只在 `MAY_NOT_FIT` 時有值:這台執行環境的顯示記憶體總量(和 `listCatalog` 的 `vramBytes` 同一個值),位元組;其他原因為 null
    AutoDownloadResult:
      type: object
      required: [sessionName, state, enqueued, skipped, dismissed]
      properties:
        sessionName:
          type: string
          pattern: '^cgb-[a-z0-9-]{1,60}$'
          description: 這個結果屬於哪一個工作階段(001 `Session.name`)
        state:
          type: string
          enum: [running, done]
          description: 判定中(還在取大小)、已完成
        enqueued:
          type: array
          description: 自動排入的模型名稱,依清單順序;`state` 為 `running` 時是空的。數量就是「這次自動排入幾個」
          items:
            type: string
        skipped:
          type: array
          description: 被跳過的模型與原因,依清單順序;已經在執行環境上或佇列中的不列在這裡
          items:
            $ref: '#/components/schemas/AutoDownloadSkipped'
        dismissed:
          type: boolean
          description: 使用者已按關閉;為 true 時前端不顯示提示區
        finishedAt:
          type: [string, 'null']
          format: date-time
          description: 判定完成的時間;`running` 時為 null
    AutoDownloadNotice:
      type: object
      required: [result]
      properties:
        result:
          oneOf:
            - $ref: '#/components/schemas/AutoDownloadResult'
            - type: 'null'
          description: 目前工作階段的自動下載結果;沒有時為 null(見 `getAutoDownloadResult`)
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST_BODY
            - INVALID_MODEL_NAME
            - INVALID_QUERY
            - INVALID_CURSOR
            - INVALID_HF_MODEL_ID
            - INVALID_CURATED_DESCRIPTION
            - INVALID_RUNTIME_TYPE
            - INVALID_AUTO_DOWNLOAD
            - EMPTY_CHAT_MESSAGES
            - INVALID_CHAT_MESSAGE
            - EMPTY_MODEL_LIST
            - CURATED_DUPLICATE
            - CURATED_NOT_FOUND
            - NO_READY_SESSION
            - SESSION_ENDED
            - MODEL_ALREADY_DOWNLOADED
            - DOWNLOAD_ALREADY_QUEUED
            - DISK_SPACE_INSUFFICIENT
            - DISK_SPACE_UNKNOWN
            - DOWNLOAD_NOT_FOUND
            - DOWNLOAD_NOT_RETRYABLE
            - AUTO_DOWNLOAD_RESULT_NOT_FOUND
            - OLLAMA_UNREACHABLE
            - OLLAMA_TIMEOUT
            - OLLAMA_BAD_RESPONSE
            - OLLAMA_BAD_REQUEST
            - OLLAMA_NOT_FOUND
            - OLLAMA_SERVER_ERROR
            - OLLAMA_STREAM_INTERRUPTED
            - LIBRARY_UNREACHABLE
            - LIBRARY_TIMEOUT
            - LIBRARY_BAD_RESPONSE
            - LIBRARY_NOT_FOUND
            - LIBRARY_CLOUD_ONLY
            - LIBRARY_SERVER_ERROR
            - HF_UNREACHABLE
            - HF_TIMEOUT
            - HF_SERVER_ERROR
            - HF_BAD_RESPONSE
            - HF_AUTH_REQUIRED
            - HF_QUANT_UNAVAILABLE
            - HF_NO_GGUF
          description: >-
            `OLLAMA_` 開頭的照 S1、`LIBRARY_` 照 002 S1、`HF_` 照 S2 原文沿用(HF_ 的三個不能下載的原因依 Q1、D15);其他是本介面自己把關的條件。
            這一輪新增的本介面代碼:`INVALID_CURSOR`、`INVALID_HF_MODEL_ID`、`INVALID_AUTO_DOWNLOAD`、`EMPTY_CHAT_MESSAGES`、`INVALID_CHAT_MESSAGE`、
            `AUTO_DOWNLOAD_RESULT_NOT_FOUND`;`SESSION_ENDED` 沿用 001 `DownloadJob.reasonCode` 的同名代碼,這一輪只出現在對話串流的最後一行。
            這裡只列本檔操作會回的代碼,其他操作的代碼以 001~003 的 `ui.openapi.yaml` 為準
        message:
          type: string
          description: >-
            給使用者看的繁體中文說明。`OLLAMA_*`、`LIBRARY_*`、`HF_*` 時是那個代碼固定的一句,取自後端固定的訊息表;
            `HF_AUTH_REQUIRED` 說明「需要登入、同意條款、私有或不存在,這一輪不支援」,`HF_QUANT_UNAVAILABLE` 說明「這個量化版本無法下載(不存在、分割檔或不是 GGUF)」,
            `HF_NO_GGUF` 說明「這個模型沒有可下載的 GGUF 檔」(FR-015)
        model:
          type: string
          description: >-
            下載相關的錯誤指出是哪一個模型:`MODEL_ALREADY_DOWNLOADED`、`DOWNLOAD_ALREADY_QUEUED`、`LIBRARY_*`、試算與加入下載的 `HF_*` 時一定有,
            是這次請求裡那一個補過版本的名稱;`CURATED_DUPLICATE` 時是清單裡已有的那一個名稱;`INVALID_MODEL_NAME` 時指出格式不對的那一個(本文有給名稱時)。
            `listHfQuants`、`searchHfModels` 的 `HF_*`、`OLLAMA_*`、`DISK_SPACE_*`、`NO_READY_SESSION` 沒有這個欄位
        reasonCode:
          $ref: '#/components/schemas/ReasonCode'
          description: '`DISK_SPACE_UNKNOWN` 的外部原因(001 S8 的 `COLAB_` 代碼)'
