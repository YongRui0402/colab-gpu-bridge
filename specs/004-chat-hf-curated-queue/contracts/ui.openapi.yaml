openapi: 3.1.0
info:
  title: 後端 UI API(對話轉送、Hugging Face 搜尋與展開、可編輯的精選清單與自動下載、佇列隨工作階段清空)
  version: 0.4.0
  description: >-
    S4(E2 後端 UI API)依 004 的 spec.md、research.md R1–R6、techstack.md、plan.md(含待決問題 Q1–Q10 的決定),
    以及 S1 的 `remote-ollama.openapi.yaml`、S2 的 `huggingface.openapi.yaml` 產出;狀態推送事件另見同目錄的 `ui-events.asyncapi.yaml`。
    以 001~003 的同名檔為底,只收這一輪新增或改變的操作與它們用到的 components:

    新增:對話轉送 `chat`(`POST /api/chat`)、Hugging Face 搜尋 `searchHfModels` 與展開量化版本 `listHfQuants`、
    自動下載結果的讀取 `getAutoDownloadResult` 與關閉 `dismissAutoDownloadResult`。

    改變:精選清單 `listCurated`、`addCurated`、`updateCurated`、`removeCurated`(多了「開好就自動下載」、名稱接受 hf.co、重複比對不分大小寫);
    試算與加入下載 `estimateDownloads`、`enqueueDownloads`(接受 hf.co 名稱,取大小依前綴分流,比對不分大小寫);
    `listDownloads`(佇列只屬於一個工作階段、`origin` 多了 `auto`、`DownloadJob` 多了 `source`);
    `retryDownload`(「已下載」比對不分大小寫)。`ModelName` 放寬接受 `hf.co/<作者>/<模型>[:<量化版本>]`。

    請求與回應不變、只有副作用改變的操作不另外收:`endSession`、`restartSession` 與工作階段的各種結束方式改成清空佇列
    (見 `info.x-queue-clearing`,取代 001 `endSession`「排隊中的保留」、`restartSession`「新類型開不起來時要重新下載的項目留在佇列裡排隊」
    與 001 `listDownloads`「排隊中的項目保留,等下一個工作階段就緒後自動依序開始」這三句);
    `listCatalog`(對話頁的模型清單照用它)、`preloadModel`、`clearCompletedDownloads`、`removeDownload` 以 001、003 的檔為準。
    H100 只在 UI 選單隱藏(004 FR-017),後端的 `GpuType` 與 `INVALID_RUNTIME_TYPE` 的判斷不變,精選項目的建議類型送 H100 照常接受。

    編號的出處:`x-requirements` 與沒有標前綴的 `FR-0xx`、`NFR-0xx`、`SC-0xx`、使用者故事、驗收情境都是 004 spec.md 的編號;
    標了「001 的」「003 的」的指那一輪的 spec.md;`Q<n>` 指 004 plan.md 的待決問題(標了「001」的指 001 的 plan.md);
    `D<n>` 指 004 的 `分身決策紀錄.md`;`S1` 是 004 的 `remote-ollama.openapi.yaml`,`S2` 是 004 的 `huggingface.openapi.yaml`;
    `002 S1` 是 002 的 `model-library.openapi.yaml`,`001 S8` 是 001 的 `colab-cli.openapi.yaml`。

    呼叫者:本系統前端 UI(瀏覽器),家中區網(含 VPN 連回)的任何裝置都能呼叫,不需要登入(001 的 NFR-009);
    UI 的靜態檔與本 API 同一個來源,所以 `servers` 只寫相對路徑 `/api`。

    錯誤本文一律是 `Error`(`{code, message}`,`message` 是給使用者看的繁體中文)。外部依賴的失敗原因沿用轉接層代碼
    (S1 的 `OLLAMA_`、002 S1 的 `LIBRARY_`、S2 的 `HF_`;`COLAB_` 由 001 S8 定),直接放在 `code`,不另造同義的代碼。
    `OLLAMA_*`、`LIBRARY_*`、`HF_*` 的 `message` 是每個代碼固定的一句繁體中文,取自後端固定的訊息表,
    不帶底層例外的文字、traceback、對方的網址或英文原文(Ollama、Hugging Face 的英文說明都不交給 UI,001 的 NFR-010)。

    不回 500(NFR-006、SC-006):本檔每一個操作上任何一種錯誤都回下面各操作列出的狀態碼與代碼;遠端 Ollama 回的 400、500
    與連線逾時照 S1 `info.x-failure-rules` 歸成 `OLLAMA_BAD_REQUEST`、`OLLAMA_SERVER_ERROR`、`OLLAMA_TIMEOUT`(Q7,D21),
    UI API 以 502、504 回,不把對方的 500 轉成本系統的 500。
  x-model-name-rule: >-
    補版本與比對的規則(FR-018,research.md R4,D11;修訂 003 的「照原樣比對」):
    (1)補版本:名稱含 `:` 就照原樣;不含 `:` 就在後面接 `:latest`(官方名稱與 `hf.co/` 名稱同一條;`hf.co/` 本身不含 `:`)。
    (2)比對:「已下載」「已在佇列」「同一批合併」「精選清單重複」一律把兩邊補過版本的名稱轉成小寫(Unicode casefold)後相等就算同一個,
    官方名稱與 `hf.co/` 名稱都一樣,和 Ollama 的名稱比對一致(S1 `pullModel` 實測)。
    例:`qwen2.5:Latest` 等於 `qwen2.5:latest`;`hf.co/Bartowski/smollm2-135M-Instruct-GGUF:Q4_K_M` 等於 `hf.co/bartowski/SmolLM2-135M-Instruct-GGUF:q4_k_m`。
    (3)不同的版本不是同一個:`qwen2.5:7b` 不等於 `qwen2.5:latest`;`hf.co/x/y`(= `hf.co/x/y:latest`)不等於 `hf.co/x/y:Q4_K_M`,
    即使 Hugging Face 把 `latest` 對到同一個檔案(S1 `pullModel`:Ollama 也當成兩個名稱)。
    (4)顯示、回應與送給遠端 Ollama 的名稱照使用者輸入的原樣(只補 `:latest`,不改大小寫);同一批合併時留第一次出現的寫法。
    執行環境上已下載的模型以遠端 Ollama `listLocalModels` 每筆的 `name` 比對,那一側不再補版本;佇列裡的項目以 `DownloadJob.model` 比對。
  x-download-check-order: >-
    `estimateDownloads` 與 `enqueueDownloads` 用同一套檢查,依下面的順序,第一個不符的就回,後面的步驟都不做(沿用 003,這一輪改了 (3)(5)(6)):
    (1)請求本文的格式(400 `INVALID_REQUEST_BODY`、`EMPTY_MODEL_LIST`、`INVALID_MODEL_NAME`),不需要工作階段;
    (2)沒有就緒的工作階段(含開啟中、重連中) → 503 `NO_READY_SESSION`;
    (3)把整批名稱照 `info.x-model-name-rule` 補過版本,不分大小寫相同的合併成一個,保留第一次出現的順序與寫法(FR-018);
    (4)讀執行環境上已下載的模型清單(一次)與佇列中排隊中、下載中的項目;讀模型清單失敗時回 502 `OLLAMA_UNREACHABLE`、502 `OLLAMA_BAD_RESPONSE` 或 504 `OLLAMA_TIMEOUT`(照 003);
    (5)依合併後的順序逐一不分大小寫比對:在模型清單裡 → 409 `MODEL_ALREADY_DOWNLOADED`;否則在佇列裡(排隊中或下載中) → 409 `DOWNLOAD_ALREADY_QUEUED`;
    `Error.model` 是這次請求裡那一個補過版本的名稱(使用者的寫法);
    (6)都沒有重複,才依合併後的順序一個一個取大小,依名稱前綴分流(research.md R4):
    `hf.co/` 開頭的向 Hugging Face 取 manifest(S2 `getHfManifest`,`tag` 是補過版本的那一段,`latest` 也照送),其他的向官方 registry 取(002 S1 `getManifest`);
    任何一個失敗就回那一個的代碼(對應見各回應),`Error.model` 指出是哪一個,後面的不再取;
    (7)讀執行環境的剩餘磁碟空間(001 S8),讀不到 → 503 `DISK_SPACE_UNKNOWN`;
    (8)`enqueueDownloads` 才有:總大小加上佇列裡還沒下載完的大小超過剩餘磁碟 → 409 `DISK_SPACE_INSUFFICIENT`;`estimateDownloads` 改以 `fits` 表示。
    Hugging Face 的 manifest 每個請求 10 秒(NFR-005),不套用展開版本的整體期限(S2 `info.x-timeout`)。
    需要登入、同意條款、私有、不存在的 hf.co 模型,與拉不下來的量化版本(不存在、分割檔、不是 GGUF)都在 (6) 擋下,
    整批不加入、佇列不變(FR-015、使用者故事 4 驗收情境 7),不等到遠端 Ollama 拉取失敗(S1 `pullModel`:那時的錯誤原文看不出原因)。
  x-hf-error-status: >-
    Hugging Face 失敗原因代碼對 HTTP 狀態碼的固定對應(plan.md Q69,D87),`searchHfModels`、`listHfQuants`、`estimateDownloads`、`enqueueDownloads` 四個操作共用:
    `HF_UNREACHABLE`、`HF_SERVER_ERROR`、`HF_BAD_RESPONSE` → 502;`HF_TIMEOUT` → 504;`HF_AUTH_REQUIRED`、`HF_NO_GGUF`、`HF_QUANT_UNAVAILABLE` → 422。
    代碼與 `message` 照原樣回(同一個代碼在四個操作的 `message` 相同,取自固定的訊息表),不改歸成別的代碼。
    各操作的 `x-error-codes` 只列那個操作正常會出現的代碼;萬一收到沒列的 `HF_*` 代碼(例如搜尋收到 `HF_NO_GGUF`、展開收到 `HF_QUANT_UNAVAILABLE`、
    試算收到 `HF_NO_GGUF`),也照這張表回,不回 500(NFR-006、SC-006)。`Error.model` 有沒有照各操作的規定(試算與加入有,搜尋與展開沒有)。
  x-queue-clearing: >-
    下載佇列只屬於一個工作階段(FR-001–FR-003,research.md R1;取代 001 的「排隊中的保留到下一個工作階段」,D7):
    (1)工作階段變成結束中、已結束、開啟失敗或失聯(`ending`、`ended`、`open_failed`、`lost`;涵蓋使用者結束、閒置自動結束、被 Colab 收回、
    重連逾時、開啟失敗,以及變更類型時舊的那一個變成結束中)時,屬於它的每一個項目都從佇列移除:排隊中、完成、失敗,
    以及下載中的那一筆(下載中斷,不先標成失敗,也不以「可用」出現在任何目錄)。每移除一筆推送一則 `download.removed`,
    全部移除後推送一則 `downloads.snapshot`;從狀態改變到 `listDownloads` 列出 0 筆在 5 秒內(SC-001、NFR-001)。
    (2)變更執行階段類型(`restartSession`):先把舊的工作階段的項目照 (1) 移除,再把呼叫當下已載入的模型以 `origin` `restore` 排進新的工作階段,
    所以佇列只剩為了重新載入而排入的那幾筆(FR-002、使用者故事 1 驗收情境 4);新的工作階段開啟失敗時,這幾筆也照 (1) 移除。
    (3)後端重新啟動時:判定先前的工作階段已在停機期間結束(例如被 Colab 收回)就照 (1) 移除它的項目(FR-003);
    接回仍在運作的同一個工作階段時不移除,中斷的下載照 001 重新排隊(spec.md 邊界情況);
    升級前留下、沒有所屬工作階段的項目在後端啟動時一併移除。
    (4)新的工作階段就緒時,只開始屬於它的排隊中項目(重新載入的那幾筆與自動下載排入的),不再接續上一台的項目。
    (5)自動下載的結果(`getAutoDownloadResult`)也屬於一個工作階段,照 (1) 一併清除,推送 `autoDownload.updated`、`result` 為 null。
  x-auto-download: >-
    自動下載(FR-011、FR-012,research.md R6;使用者故事 3 驗收情境 4–10):
    (1)觸發:每個工作階段(以工作階段名稱區分)第一次變成「就緒」時做一次;重連中又接回、後端重新啟動後接回同一個工作階段都不再做(驗收情境 8)。
    精選清單沒有任何一項設了 `autoDownload` 時不判定、不排入,但仍記下這個工作階段已經做過這一次(Q24、D38:同一個工作階段之後才打開 `autoDownload` 的項目,
    重連接回時也不會被排入);對外沒有結果(`getAutoDownloadResult` 的 `result` 為 null),不推送 `autoDownload.updated`,不提示。
    (2)開始時先記下這個工作階段的結果、`state` 為 `running`,推送 `autoDownload.updated`;判定完成後 `state` 改為 `done`,寫入排入與跳過的模型再推送一次。
    (3)判定:依精選清單的順序,只看 `autoDownload` 為 true 的項目,名稱照 `info.x-model-name-rule` 比對:
    (a)已在執行環境上,或已在佇列中(含變更類型時排入的重新載入項目) → 不排,也不列為跳過(驗收情境 5);
    讀執行環境上的模型清單失敗時視為執行環境上沒有任何模型(新的執行環境本來就是空的),照常往下判定;
    (b)取大小,分流同 `info.x-download-check-order` 的 (6),同時最多 4 個,每個請求 10 秒;失敗 → 跳過,`reason` 為 `SIZE_UNAVAILABLE`,
    `reasonCode` 帶那一次的 `LIBRARY_*` 或 `HF_*` 代碼(驗收情境 7);
    (c)顯示記憶體總量讀得到(和 `listCatalog` 的 `vramBytes` 同一個值,003 的 FR-003)而大小超過它 → 跳過,`reason` 為 `MAY_NOT_FIT`
    (和模型目錄的 `mayNotFit` 同一個比較);讀不到時不以此跳過(驗收情境 9);
    (d)讀執行環境的剩餘磁碟空間一次(001 S8);讀不到 → 其餘還沒判定的項目都跳過,`reason` 為 `DISK_SPACE_UNKNOWN`、`reasonCode` 帶 `COLAB_` 代碼;
    (e)已決定排入的大小 + 佇列裡還沒下載完的大小 + 這一項 > 剩餘磁碟空間 → 跳過,`reason` 為 `DISK_SPACE_INSUFFICIENT`;後面較小的仍照順序判斷(驗收情境 6);
    跳過的項目在取得到的範圍內帶 `sizeBytes`、`freeDiskBytes`、`vramBytes`(見 `AutoDownloadSkipped`,Q68、D86);
    (f)其餘依清單順序一次排入佇列(`origin` 為 `auto`、`preloadOnComplete` 為 false),每一筆推送 `download.updated`,接著開始下載。
    (4)從就緒到 `state` 為 `done` 在 30 秒內(SC-003;精選清單 8 項以內、每個取大小的請求最多 10 秒時成立,research.md R6 估算)。
    (5)已經排入之後,使用者把那一項從精選清單刪除或取消 `autoDownload`,已排入的下載不受影響(spec.md 邊界情況)。
    (6)結果保留到工作階段結束或使用者按關閉(`dismissAutoDownloadResult`),重新整理頁面、後端重新啟動接回同一個工作階段後仍讀得到(FR-012、SC-003)。
servers:
  - url: /api
    description: 與 UI 靜態檔同一個來源;port 沿用 001(8780)
paths:
  /chat:
    post:
      operationId: chat
      summary: 對話頁送出一則訊息,串流取得模型的回覆
      description: >-
        FR-004:對話頁每送出一則就呼叫一次,`messages` 帶齊這段對話前面的每一則(多輪對話靠瀏覽器自己帶,後端不保留對話)。
        後端轉送到目前工作階段的遠端 Ollama(S1 `chat`,`{"model","messages","stream":true,"keep_alive":-1}`,Q9、D23),
        不加其他參數;請求本文的其他欄位不轉送(spec.md 假設:不做 system prompt 與 temperature)。瀏覽器不直連 Colab。

        回應:收到遠端 Ollama 200 的回應標頭之後才回 200,本文是 `application/x-ndjson`,每行一個 `ChatStreamLine`,邊收邊送、不緩衝
        (NFR-003、SC-002:第一段比遠端多等不超過 0.5 秒)。遠端的每一行照原樣轉送(`ChatChunk`,含 `message.thinking`,Q10、D24);
        `done: true` 那一行送出後結束,這則回覆完成。`done: true` 那一行缺少 `eval_count` 或 `eval_duration`、或 `eval_duration` 為 0 時仍算完成,
        前端不顯示每秒 token 數(Q8、D22)。耗時由前端自己計時(送出到收到 `done: true`),每秒 token 數 = `eval_count ÷ (eval_duration ÷ 10⁹)`(FR-005)。

        串流已經開始之後的失敗不能再改 HTTP 狀態碼,改以最後一行 `ChatStreamFailure`(`{"error": {"code","message"}}`)交給前端,接著結束串流;
        前面已送出的段落不撤回,前端保留並標示中斷與原因(FR-008、驗收情境 8)。代碼見 200 回應的 `x-stream-error-codes`。
        遠端 Ollama 自己送的 `{"error": "<英文>"}` 行不原樣轉送,一律換成這一行(Q6、D20:`OLLAMA_SERVER_ERROR`)。

        停止(FR-006):前端斷開這個請求的連線即可;後端隨之斷開遠端的請求,遠端 Ollama 停止產生(S1 `chat`),後端不另外送任何一行,也不記成錯誤。

        閒置倒數(FR-007、驗收情境 9):通過 (1)(2) 的檢查之後到串流結束(含完成、失敗、前端斷開)之間,這個請求和 Ollama 相容端點的請求一樣算進行中,
        不計閒置;結束時重設倒數,`session.updated` 照 001 的時機推送新的 `deadline`。

        不記內容(NFR-002):請求與回應的本文(訊息與回覆)不寫進資料庫與任何日誌,日誌只記時間、模型、耗時與狀態碼(001 的規則)。

        檢查依序:(1)請求本文(400);(2)沒有就緒的工作階段 → 503 `NO_READY_SESSION`;(3)送到遠端 Ollama,串流開始之前的失敗照 S1 `info.x-failure-rules` 第 1–4 條
        回 404、502、504。不先讀模型清單確認模型存在(會多一次往返,NFR-003),不在執行環境上的模型由遠端回 404 判定。
        選的模型還沒載入時遠端先載入再回覆,載入的時間落在第一段之前(驗收情境 6;前端依 `listCatalog` 的 `loaded` 顯示「正在載入」)。
      x-requirements: [FR-004, FR-005, FR-006, FR-007, FR-008, NFR-002, NFR-003, NFR-006, SC-002, SC-006]
      x-callers: UI 的對話頁;工作階段「就緒」
      x-timeout: >-
        照 S1 `chat`:連線 10 秒;收到回應標頭(含第一段之前的載入)300 秒;兩段之間 300 秒;不設總時長。
        回應標頭之前逾時回 504 `OLLAMA_TIMEOUT`,之後逾時以最後一行 `OLLAMA_TIMEOUT` 結束
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatInput'
      responses:
        '200':
          description: >-
            NDJSON 串流,每行一個 `ChatStreamLine`。正常結束時最後一行是 `done: true` 的 `ChatChunk`;
            失敗時最後一行是 `ChatStreamFailure`,`error.code` 是 `x-stream-error-codes` 其中一個:
            `OLLAMA_TIMEOUT` 兩段之間超過 300 秒;`OLLAMA_STREAM_INTERRUPTED` 遠端在 `done: true` 之前斷線或結束;
            `OLLAMA_SERVER_ERROR` 遠端送了帶 `error` 的一行(推論失敗,Q6);`OLLAMA_BAD_RESPONSE` 遠端某一行不是 JSON 物件或必要欄位型別不符(S1 `chat` 200 的說明);
            `SESSION_ENDED` 回覆途中工作階段被結束、變更類型或判定失聯(本系統結束轉送)。
          x-recipients: 呼叫者(送出這則訊息的那個對話頁);不推送給其他分頁,也不經 SSE
          x-stream-error-codes: [OLLAMA_TIMEOUT, OLLAMA_STREAM_INTERRUPTED, OLLAMA_SERVER_ERROR, OLLAMA_BAD_RESPONSE, SESSION_ENDED]
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/ChatStreamLine'
        '400':
          description: >-
            本文不是合法 JSON 或不是物件;`model` 缺少、不是字串或不符 `ModelName`;`messages` 缺少、不是陣列或是空的;
            `messages` 裡某一則不是物件、`role` 不是 `user` 或 `assistant`,或 `content` 不是字串
          x-error-codes: [INVALID_REQUEST_BODY, INVALID_MODEL_NAME, EMPTY_CHAT_MESSAGES, INVALID_CHAT_MESSAGE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 選的模型不在執行環境上(遠端回 404,S1 `chat`;例如模型清單過時)
          x-error-codes: [OLLAMA_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            串流開始之前遠端 Ollama 失敗(S1 `info.x-failure-rules` 第 2–4 條):連不到(`OLLAMA_UNREACHABLE`);
            回 400(`OLLAMA_BAD_REQUEST`,本系統送出的請求不被接受);回 500,例如記憶體不足載入失敗(`OLLAMA_SERVER_ERROR`);
            其他狀態碼或 200 但不是 NDJSON(`OLLAMA_BAD_RESPONSE`)。都不回 500(NFR-006,Q7)
          x-error-codes: [OLLAMA_UNREACHABLE, OLLAMA_BAD_REQUEST, OLLAMA_SERVER_ERROR, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 沒有就緒的工作階段(含未開啟、開啟中、重連中、結束中;FR-008、驗收情境 7)
          x-error-codes: [NO_READY_SESSION]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 連線逾時,或 300 秒內沒有收到遠端的回應標頭(S1 `info.x-failure-rules` 第 1 條)
          x-error-codes: [OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /huggingface/search:
    get:
      operationId: searchHfModels
      summary: 以關鍵字搜尋 Hugging Face 上含 GGUF 檔、不需登入的模型(可載入更多)
      description: >-
        FR-013:轉呼叫 S2 的 `searchHfModels`(固定 `filter=gguf`、`gated=false`、`sort=downloads`、`limit=20`),依下載次數由多到少,一頁最多 20 筆。
        載入更多:回應的 `nextCursor` 不為 null 時還有下一頁,前端下一次原樣帶回 `cursor`(和第一頁同一個 `q`);`cursor` 是對方給的不透明字串,不是頁碼。
        沒有符合的模型時回 200、`items` 為空陣列(驗收情境 5)。組不出 `hf.co/` 名稱的那一筆略過(S2)。
        不需要工作階段;搜尋結果不標「已下載」,展開版本(`listHfQuants`)才標。
        失敗只影響 Hugging Face 的搜尋區(FR-016):官方模型庫、精選清單與直接輸入名稱不呼叫 Hugging Face,這段時間照常回應(SC-004)。
        `HF_*` 的狀態碼照 `info.x-hf-error-status`。
      x-requirements: [FR-013, FR-016, NFR-005, NFR-006, SC-004, SC-006]
      x-callers: UI(家中區網的任何瀏覽器,不需登入);不需要工作階段
      x-timeout: 對 huggingface.co 每個請求 10 秒(NFR-005,S2 `info.x-timeout`),逾時歸 `HF_TIMEOUT`;從送出到回應在 11 秒內(SC-004)
      parameters:
        - name: q
          in: query
          required: true
          description: 關鍵字,去掉前後空白後 1 到 100 字元(和 001 `searchLibrary` 相同)
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: cursor
          in: query
          required: false
          description: 載入更多時帶上一頁回應的 `nextCursor`,原樣帶回;第一頁不帶
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 這一頁符合的模型;0 筆是正常結果
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HfSearchPage'
        '400':
          description: 關鍵字去掉空白後是空的或超過 100 字元;帶了 `cursor` 但是空字串
          x-error-codes: [INVALID_QUERY, INVALID_CURSOR]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            連不到 huggingface.co(`HF_UNREACHABLE`)、對方回 5xx(`HF_SERVER_ERROR`),
            或非預期的狀態碼、回應格式不符(`HF_BAD_RESPONSE`,含對方不接受帶回的 `cursor`);條件照 S2 `info.x-failure-rules`。
            前端顯示暫時無法搜尋 Hugging Face(驗收情境 6)
          x-error-codes: [HF_UNREACHABLE, HF_SERVER_ERROR, HF_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: huggingface.co 在 10 秒內沒有完成(S2 `info.x-failure-rules` 第 1 條)
          x-error-codes: [HF_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /huggingface/models/{author}/{model}/quants:
    get:
      operationId: listHfQuants
      summary: 展開一個 Hugging Face 模型,列出可下載的量化版本與大小
      description: >-
        FR-014:照 S2 取檔案清單(`listRepoFiles`,只讀第一頁,Q3)找出量化版本的候選,再以 manifest(`getHfManifest`,同時最多 4 個)逐一驗證並取精確大小
        (`layers[].size` 的總和);manifest 回 400 的候選不列出(不存在、分割檔或不是 llama.cpp 相容的 GGUF),一個都沒有列出時回 422 `HF_NO_GGUF`(FR-015)。
        `quants` 依檔案清單的順序。每一個的 `name` 是 `hf.co/<作者>/<模型>:<量化版本>`,勾選後照它走 `estimateDownloads`、`enqueueDownloads`
        (驗收情境 3;和官方模型庫的模型同一批)。不列 `latest`。

        已下載(驗收情境 2):工作階段「就緒」時讀執行環境上的模型清單一次,`name` 照 `info.x-model-name-rule` 不分大小寫比對,`downloaded` 標出已有的;
        沒有就緒的工作階段,或讀模型清單失敗、在整體期限內沒有讀完時,`runtimeChecked` 為 false、`downloaded` 都是 false,展開照常回 200。

        時間上限(Q4、D18;Q67、D85):收到展開請求時,Hugging Face 這一段(檔案清單加所有 manifest)與讀執行環境的模型清單(工作階段就緒時才讀)同時開始、平行進行,
        兩段的期限都是從收到展開請求起算 10 秒,每個對 huggingface.co 的請求自己的 10 秒仍在:
        (a)Hugging Face 這一段先完成時,只等模型清單到同一個期限;期限到了還沒讀完,就取消模型清單的讀取,`runtimeChecked` 為 false、照常回 200;
        (b)模型清單先讀完(或讀失敗)時,只等 Hugging Face 這一段到同一個期限;
        (c)Hugging Face 這一段期限到時還沒完成,取消還沒完成的 Hugging Face 請求與模型清單的讀取,整個展開回 504 `HF_TIMEOUT`;
        (d)任何一個 Hugging Face 請求出現 400 以外的失敗,就取消其他還沒完成的請求與模型清單的讀取,整個展開回那一個的代碼(S2 `getHfManifest`)。
        所以不論哪一段先完成,從收到請求到回應都在 10 秒加處理時間之內,符合 SC-004 的 11 秒;兩段不串接。
        狀態碼照 `info.x-hf-error-status`。
      x-requirements: [FR-014, FR-015, FR-016, FR-018, NFR-005, NFR-006, SC-004, SC-006]
      x-callers: UI(家中區網的任何瀏覽器,不需登入);不需要工作階段(就緒時才標已下載)
      x-timeout: >-
        Hugging Face 這一段與讀執行環境的模型清單平行進行,都從收到展開請求起算 10 秒(Q67、D85);每個對 huggingface.co 的請求也各自不超過 10 秒(S2 `info.x-timeout`)。
        Hugging Face 這一段逾時歸 `HF_TIMEOUT`;模型清單逾時只讓 `runtimeChecked` 為 false
      parameters:
        - name: author
          in: path
          required: true
          description: 作者,取自 `searchHfModels` 的 `author`(大小寫照原樣)
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        - name: model
          in: path
          required: true
          description: 模型名稱,取自 `searchHfModels` 的 `model`(不含 `:量化版本`)
          schema:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      responses:
        '200':
          description: 這個模型可下載的量化版本,至少一個
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HfQuantList'
        '400':
          description: 作者或模型名稱不符 `[A-Za-z0-9][A-Za-z0-9._-]*`(組不出 `hf.co/` 名稱)
          x-error-codes: [INVALID_HF_MODEL_ID]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            這個模型不能在這一輪下載,佇列不變(FR-015、驗收情境 7):需要登入、同意條款、私有或不存在
            (檔案清單或 manifest 回 401,Q2、D16:`HF_AUTH_REQUIRED`);沒有可下載的 GGUF 檔
            (檔案清單沒有候選,或候選的 manifest 都回 400:`HF_NO_GGUF`)。`message` 說明原因(這一輪不支援需要登入的模型)
          x-error-codes: [HF_AUTH_REQUIRED, HF_NO_GGUF]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            連不到 huggingface.co、對方回 5xx,或非預期的狀態碼與回應格式不符(含 manifest 200 但沒有模型層,Q5、D19);
            條件照 S2 `info.x-failure-rules`。前端顯示暫時無法使用 Hugging Face(FR-016、驗收情境 6)
          x-error-codes: [HF_UNREACHABLE, HF_SERVER_ERROR, HF_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 某個 Hugging Face 請求超過 10 秒,或 Hugging Face 這一段在收到展開請求起 10 秒的期限內沒有完成(Q4、Q67);模型清單逾時不回 504
          x-error-codes: [HF_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
