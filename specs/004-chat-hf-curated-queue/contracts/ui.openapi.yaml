        '200':
          description: 下載佇列
          x-recipients: 呼叫者(UI)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadQueue'
    post:
      operationId: enqueueDownloads
      summary: 把一個或多個模型(官方或 hf.co)加入下載佇列
      description: >-
        沿用 001~003:一次勾選多個(或輸入一個名稱)加入佇列,依序在背景下載到目前的執行環境(S1 `pullModel`,一次一個);
        任何一個模型不符,整批都不加入,佇列不變,也不推送 `download.updated`。加入的項目屬於目前的工作階段(`info.x-queue-clearing`),`origin` 為 `user`。

        這一輪:名稱可以是 `hf.co/<作者>/<模型>[:<量化版本>]`(FR-018),和官方模型庫的模型同一批、同一個佇列依序下載(使用者故事 4 驗收情境 3);
        檢查依 `info.x-download-check-order`,比對不分大小寫(`info.x-model-name-rule`)。
        hf.co 名稱需要登入、同意條款、私有或不存在 → 422 `HF_AUTH_REQUIRED`;量化版本無法下載(不存在、分割檔或不是 GGUF) → 422 `HF_QUANT_UNAVAILABLE`
        (FR-015、使用者故事 4 驗收情境 7);`HF_*` 的狀態碼照 `info.x-hf-error-status`。下載完成後照 001 出現在模型目錄,區網程式與對話頁都能用(驗收情境 4)。

        下載失敗時那一筆為 `failed`,`reasonCode` 是 S1 `pullModel` 的代碼(含這一輪照 S1 補上的 `OLLAMA_BAD_REQUEST`、`OLLAMA_SERVER_ERROR`
        與連線逾時的 `OLLAMA_TIMEOUT`,Q7)。同時加入的處理照 003(只有一個請求加入,另一個回 409 `DOWNLOAD_ALREADY_QUEUED`,整批不加入)。
      x-requirements: [FR-014, FR-015, FR-016, FR-018, NFR-005, NFR-006, SC-006]
      x-callers: UI;工作階段「就緒」
      x-timeout: >-
        讀執行環境上的模型清單 10 秒;每個 manifest 請求 10 秒(官方 registry 照 002 S1、Hugging Face 照 S2,NFR-005),依序送出,
        不另設整次呼叫的總時限;pull 照 S1(連線 10 秒、兩行進度之間 60 秒、不設總時長)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadSelection'
      responses:
        '201':
          description: 加入的項目(都是排隊中,或第一個馬上變成下載中);每個合併後的名稱一筆
          x-recipients: 呼叫者(UI);每一筆也以 `download.updated` 推給所有連著的 UI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJobList'
        '400':
          description: 本文不是合法 JSON;`models` 是空的;某個模型名稱格式不對(`Error.model` 指出是哪一個)
          x-error-codes: [INVALID_REQUEST_BODY, EMPTY_MODEL_LIST, INVALID_MODEL_NAME]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 官方模型庫沒有某個模型或版本(照 002 S1;`Error.model` 指出是哪一個),整批不加入
          x-error-codes: [LIBRARY_NOT_FOUND]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: >-
            某個模型已經在執行環境上;某個模型已經在佇列裡(排隊中或下載中,含同時送出的另一個請求剛加入的);總大小超過剩餘磁碟空間。
            比對不分大小寫,前兩個的 `Error.model` 是這次請求裡那一個補過版本的名稱,整批不加入;`DISK_SPACE_INSUFFICIENT` 沒有 `Error.model`
          x-error-codes: [MODEL_ALREADY_DOWNLOADED, DOWNLOAD_ALREADY_QUEUED, DISK_SPACE_INSUFFICIENT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            某個模型不能下載,`Error.model` 指出是哪一個,整批不加入:官方的版本只能在 Ollama 雲端執行(`LIBRARY_CLOUD_ONLY`);
            hf.co 模型需要登入、同意條款、私有或不存在(Hugging Face manifest 回 401,`HF_AUTH_REQUIRED`);
            hf.co 的量化版本無法下載(manifest 回 400:不存在、分割檔或這個 repo 不是 GGUF,`HF_QUANT_UNAVAILABLE`)
          x-error-codes: [LIBRARY_CLOUD_ONLY, HF_AUTH_REQUIRED, HF_QUANT_UNAVAILABLE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            取大小時連不到、對方回 5xx 或格式不符:官方 registry(`LIBRARY_UNREACHABLE`、`LIBRARY_SERVER_ERROR`、`LIBRARY_BAD_RESPONSE`,照 002 S1)
            或 Hugging Face(`HF_UNREACHABLE`、`HF_SERVER_ERROR`、`HF_BAD_RESPONSE`,照 S2;含 manifest 沒有模型層),這時 `Error.model` 指出是哪一個;
            讀執行環境上的模型清單時連不到遠端 Ollama 或回應格式不對(`OLLAMA_UNREACHABLE`、`OLLAMA_BAD_RESPONSE`,沒有 `Error.model`)。整批不加入
          x-error-codes: [LIBRARY_UNREACHABLE, LIBRARY_SERVER_ERROR, LIBRARY_BAD_RESPONSE, HF_UNREACHABLE, HF_SERVER_ERROR, HF_BAD_RESPONSE, OLLAMA_UNREACHABLE, OLLAMA_BAD_RESPONSE]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 沒有就緒的工作階段(含開啟中、重連中;在重複檢查之前);讀不到執行環境的剩餘磁碟空間(`Error.reasonCode` 帶 001 S8 的代碼)
          x-error-codes: [NO_READY_SESSION, DISK_SPACE_UNKNOWN]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: >-
            某個 manifest 請求超過 10 秒(`LIBRARY_TIMEOUT` 或 `HF_TIMEOUT`,`Error.model` 指出是哪一個);
            讀執行環境上的模型清單在 10 秒內沒有完成(`OLLAMA_TIMEOUT`,沒有 `Error.model`)。整批不加入
          x-error-codes: [LIBRARY_TIMEOUT, HF_TIMEOUT, OLLAMA_TIMEOUT]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /downloads/estimate:
